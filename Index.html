        function toggleModalPayant() {
            isPayant = !isPayant;
            const wrap = document.getElementById('prix-contenu-wrap');
            const btn = document.getElementById('btn-payant-modal');
            wrap.style.display = isPayant ? 'block' : 'none';
            btn.style.background = isPayant ? 'var(--star-shop)' : '#222';
            btn.style.color = 'white';
        }

        function uploadBuzzFromModal() {
            const btn = document.querySelector('#ui-modal button[style*="background:var(--buzz)"]');
            if (btn && btn.disabled) { toast("⏳ Publication déjà en cours...", 'var(--gold)'); return; }

            const txt = document.getElementById('buzz-txt').value.trim();
            const fileInput = document.getElementById('buzz-file');
            const file = fileInput.files[0];
            const prix = isPayant ? (parseInt(document.getElementById('buzz-prix').value) || 0) : 0;
            const sukuNom = isPayant ? (document.getElementById('suku-nom').value.trim() || null) : null;
            const sukuPrix = isPayant ? (parseInt(document.getElementById('suku-prix').value) || 0) : 0;
            if (!file && !txt) { toast("Formulaire vide !", 'var(--red)'); return; }

            if (btn) { btn.disabled = true;
                btn.innerText = '⏳ Publication...';
                btn.style.opacity = '0.6'; }

            toast("⏳ Envoi en cours...", 'var(--gold)');

            const postData = { name: me.name, phone: myPhone, text: txt, type: 't', date: Date.now(), prix, sukuNom,
                sukuPrix };

            const finishPublish = () => {
                if (btn) { btn.disabled = false;
                    btn.innerText = '🎬 METTRE EN LIGNE';
                    btn.style.opacity = '1'; }
            };

            if (file) {
                const r = new FileReader();
                r.onload = e => {
                    postData.media = e.target.result;
                    if (file.type.startsWith('image')) postData.type = 'i';
                    else if (file.type.startsWith('video')) postData.type = 'v';
                    else if (file.type.startsWith('audio')) postData.type = 'a';
                    db.ref('buzz').push(postData).then(() => { toast("✅ Publié sur IkaBuz !");
                        closeModal();
                        loadBuzzData();
                        finishPublish(); }).catch(err => { toast("❌ Erreur: " + err.message, 'var(--red)');
                        finishPublish(); });
                };
                r.onerror = () => { toast("❌ Erreur de lecture du fichier", 'var(--red)');
                    finishPublish(); };
                r.readAsDataURL(file);
            } else {
                db.ref('buzz').push(postData).then(() => { toast("✅ Message publié !");
                    closeModal();
                    loadBuzzData();
                    finishPublish(); }).catch(err => { toast("❌ Erreur: " + err.message, 'var(--red)');
                    finishPublish(); });
            }
        }

        function publishToCatalog() {
            const nom = document.getElementById('buzz-txt').value.trim();
            const file = document.getElementById('buzz-file').files[0];
            if (!nom || !file) { toast("Remplis le texte et choisis une photo", 'var(--red)'); return; }
            const catMap = { '1': 'Grossiste', '2': 'Boutique', '3': 'Artisan', '4': 'Restaurant' };
            const cat = prompt("Catégorie :\n1. Grossiste\n2. Boutique\n3. Artisan\n4. Restaurant");
            const dest = catMap[cat];
            if (!dest) { toast("Catégorie invalide", 'var(--red)'); return; }
            const prix = parseInt(prompt("Prix en CFA :"));
            if (!prix || prix <= 0) { toast("Prix invalide", 'var(--red)'); return; }
            const r = new FileReader();
            r.onload = e => { db.ref('catalogues').push({ role: dest, nom, prix, img: e.target.result, owner: myPhone,
                    shop: me.name, date: Date.now() });
                toast("✅ Article ajouté à la vitrine !"); };
            r.readAsDataURL(file);
        }

        function loadBuzzData() {
            const myKey = dbKey(myPhone);
            db.ref('unlocked_buzz/' + myKey).once('value', unlockedSnap => {
                const unlockedPosts = unlockedSnap.val() || {};
                db.ref('buzz').on('value', s => {
                    const container = document.getElementById('buzz-container');
                    if (!container) return;
                    container.innerHTML = '';
                    const posts = [];
                    s.forEach(c => { posts.unshift({ id: c.key, ...c.val() }); });
                    posts.forEach(b => {
                        if (currentBuzzFilter === 'me' && b.phone !== myPhone) return;
                        const id = b.id;
                        const isOwner = (myPhone === b.phone || isAdminPhone(myPhone));
                        const delBtn = isOwner ?
                            `<button class="del-btn" onclick="confirmDelPost('${id}')" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0;">🗑️</button>` :
                            '';
                        const estPayant = (b.prix && Number(b.prix) > 0);
                        const estDebloque = unlockedPosts[id] || isOwner;
                        const mediaClass = (estPayant && !estDebloque) ? "buzz-media media-blur" :
                            "buzz-media";
                        let lockOverlayHtml = '';
                        if (estPayant && !estDebloque) {
                            lockOverlayHtml = `
                            <div class="star-lock-overlay" style="position:absolute;top:0;left:0;width:100%;height:62%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(to bottom,rgba(0,0,0,0.92) 60%,transparent 100%);z-index:3;padding:20px;text-align:center;">
                                <div style="font-size:42px;margin-bottom:5px;">🌟🌟🌟🌟</div>
                                <div style="font-weight:900;color:var(--gold);font-size:18px;">IKASTAR PREMIUM</div>
                                <p style="font-size:13px;color:#fff;margin:6px 0 14px;">Accéder au contenu de <b>@${escapeHtml(b.name)}</b> pour <b>${Number(b.prix).toLocaleString()} CFA</b></p>
                                <button class="btn-sm" style="background:var(--star-shop);color:white;font-weight:700;padding:12px 24px;font-size:13px;border:none;border-radius:30px;cursor:pointer;" onclick="unlockStarContent('${id}',${b.prix},'${b.phone}','${(b.name||'').replace(/'/g,"\\'")}');">💳 DÉBLOQUER</button>
                            </div>`;
                        }
                        let mediaHtml = '';
                        if (b.type === 'v') {
                            mediaHtml =
                                `<video src="${b.media}" class="${mediaClass}" onclick="handleBuzz('${id}',this)" playsinline loop preload="metadata" muted style="width:100%;height:100%;object-fit:cover;background:#111;position:absolute;top:0;left:0;z-index:1;"></video>`;
                            if (estDebloque) {
                                mediaHtml =
                                    `<video src="${b.media}" class="buzz-media" onclick="handleBuzz('${id}',this)" playsinline loop preload="metadata" controls style="width:100%;height:100%;object-fit:cover;background:#111;position:absolute;top:0;left:0;z-index:1;"></video>`;
                            }
                        } else if (b.type === 'i') {
                            mediaHtml =
                                `<img src="${b.media}" class="${mediaClass}" onclick="handleBuzz('${id}',this)" style="width:100%;height:100%;object-fit:cover;background:#111;position:absolute;top:0;left:0;z-index:1;">`;
                        } else if (b.type === 'a') {
                            mediaHtml =
                                `<div class="audio-player-container" style="position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:2;width:80%;">
                                <div class="audio-disc${estDebloque?' ':'_locked'}" id="disc-${id}" style="width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#222 20%,#000 60%,var(--gold) 100%);margin:0 auto 20px;border:4px solid #333;animation:rotateDisc 4s linear infinite;animation-play-state:paused;box-shadow:0 0 25px rgba(252,209,22,0.4);${estDebloque?'':'opacity:0.4;'}"></div>
                                ${estDebloque?`<audio src="${b.media}" style="width:100%;" controls onplay="document.getElementById('disc-${id}').classList.add('playing')" onpause="document.getElementById('disc-${id}').classList.remove('playing')"></audio>`:'<p style="color:var(--gold);font-size:12px;margin-top:8px;">🔒 Débloque pour écouter</p>'}
                            </div>`;
                        }

                        let sukuHtml = '';
                        if (b.sukuNom && b.sukuPrix > 0) {
                            sukuHtml =
                                `<button onclick="instantBuy('${id}','${b.phone}','${(b.name||'').replace(/'/g,"\\'")}','${(b.sukuNom||'').replace(/'/g,"\\'")}',${b.sukuPrix})" style="background:var(--main);color:white;grid-column:span 2;font-weight:900;margin-bottom:6px;border-radius:12px;font-size:12px;padding:10px;border:none;cursor:pointer;">🛍️ ACHETER : ${escapeHtml(b.sukuNom)} (${Number(b.sukuPrix).toLocaleString()} CFA)</button>`;
                        }
                        const descAffichee =
                            `${escapeHtml(b.text)||''}${(estPayant&&!estDebloque)?'<br><i style="color:var(--gold);font-size:11px;">🔒 Fichier Premium — Débloquez pour accéder</i>':''}`;
                        container.innerHTML += `
                        <div class="buzz-item" style="height:${feedH}px;background:#000;position:relative;scroll-snap-align:start;flex-shrink:0;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid #111;">
                            <div class="buzz-anim" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:72px;font-weight:900;color:var(--main);text-shadow:0 0 30px rgba(29,185,84,0.6);pointer-events:none;z-index:100;opacity:0;">️buzz</div>
                            ${lockOverlayHtml}
                            ${mediaHtml}
                            <div class="buzz-info" style="padding:25px 20px 40px;background:linear-gradient(to top,rgba(0,0,0,1) 50%,rgba(0,0,0,0.4) 80%,rgba(0,0,0,0));position:relative;z-index:2;width:100%;">

                                        ${delBtn}
                                    </div>

                                <p style="font-size:13px;margin:5px 0;color:#eee;">${descAffichee}</p>
                                <div class="buzz-actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
                                    ${sukuHtml}
                                    <button onclick="sendGift('${b.phone}','${(b.name||'').replace(/'/g,"\\'")}');" style="background:var(--gold);color:black;font-size:12px;padding:10px;border-radius:10px;border:none;cursor:pointer;">🎁 Cadeau</button>
                                    <button onclick="openComments('${id}')" style="background:rgba(255,255,255,0.15);font-size:12px;padding:10px;border-radius:10px;border:none;color:white;cursor:pointer;">💬 Avis</button>
                                </div>
                            </div>
                        </div>`;
                        db.ref('buzz_likes/' + id).on('value', snap => { const el = document.getElementById(
                                'count-' + id); if (el) el.innerText = (snap.val() || 0) + ' buzz'; });
                    });
                    setTimeout(() => { document.querySelectorAll('.buzz-item').forEach(el => el.style
                            .height = feedH + 'px'); }, 50);

        function confirmDelPost(id) { confirmDel("🗑️ Supprimer ce Buzz ?", () => { db.ref('buzz/' + id).remove();
                db.ref('buzz_likes/' + id).remove();
                db.ref('buzz_comments/' + id).remove();
                toast("🗑️ Supprimé"); }); }

        function handleBuzz(postId, element) {
            const now = Date.now();
            if (now - lastTap < 350) {
                const anim = element.closest('.buzz-item').querySelector('.buzz-anim');
                anim.classList.remove('animate-buzz');
                void anim.offsetWidth;
                anim.classList.add('animate-buzz');
                db.ref('buzz_likes/' + postId).transaction(c => (c || 0) + 1);
            }
            lastTap = now;
        }

        function unlockStarContent(postId, price, ownerPhone, ownerName) {
            const myKey = dbKey(myPhone);
            const targetKey = dbKey(ownerPhone);
            const amt = Number(price);
            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < amt) return toast("Solde insuffisant !", 'var(--red)');
                if (confirm(`Débloquer le contenu de @${ownerName} pour ${amt.toLocaleString()} CFA ?`)) {
                    const comm = Math.round(amt * COMMISSION_RATE);
                    const net = amt - comm;
                    db.ref('users/' + myKey + '/solde').set(solde - amt);
                    db.ref('users/' + targetKey + '/solde').transaction(v => (v || 0) + net);
                    db.ref('users/' + targetKey + '/gains').transaction(v => (v || 0) + net);
                    db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v || 0) + comm);
                    db.ref('unlocked_buzz/' + myKey + '/' + postId).set(true);
                    logHistory(myKey, '🔓 UNLOCK @' + ownerName, -amt);
                    logHistory(targetKey, '⭐ REVENU IKASTAR', net);
                    toast("🔓 Accès Premium Débloqué !");
                    loadBuzzData();
                }
            });
        }

        function instantBuy(postId, sellerPhone, sellerName, prodNom, prix) {
            const myKey = dbKey(myPhone);
            const sellerKey = dbKey(sellerPhone);
            const pAmount = Number(prix);
            if (myKey === sellerKey) return toast("C'est votre produit !", 'var(--red)');
            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < pAmount) return toast("Solde insuffisant !", 'var(--red)');
                if (confirm(`Achat de "${prodNom}" pour ${pAmount.toLocaleString()} CFA ?`)) {
                    const comm = Math.round(pAmount * COMMISSION_RATE);
                    const net = pAmount - comm;
                    db.ref('users/' + myKey + '/solde').set(solde - pAmount);
                    db.ref('users/' + sellerKey + '/solde').transaction(v => (v || 0) + net);
                    db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v || 0) + comm);
                    logHistory(myKey, '🛍️ ACHAT : ' + prodNom, -pAmount);
                    logHistory(sellerKey, '📦 VENTE : ' + prodNom, net);
                    toast("✅ Achat validé ! Discussion ouverte.");
                    const chatId = [myPhone, sellerPhone].sort().join('_').replace(/\+/g, '');
                    db.ref('chats/' + chatId).push({ s: myPhone,
                        t: `🛍️ J'ai acheté votre article "${prodNom}" (${pAmount} CFA). On procède à la livraison ?`,
                        d: Date.now() });
                    changeTab('home');
                    openIkaChatInbox();
                }
            });
        }

        function openComments(postId) {
            openModal("💬 Avis & Commentaires");
            const content = document.getElementById('modal-content');
            content.innerHTML = `
            <div id="comm-list" style="max-height:300px;overflow-y:auto;margin-bottom:14px;"></div>
            <div style="display:flex;gap:8px;background:var(--card2);padding:10px;border-radius:30px;">
                <input type="text" id="new-comm" placeholder="Ton avis..." style="margin:0;background:transparent;border:none;flex:1;color:white;padding:10px 16px;font-size:14px;">
                <button onclick="addComment('${postId}')" style="width:50px;height:42px;border-radius:50%;flex-shrink:0;padding:0;background:var(--main);border:none;color:white;cursor:pointer;">✓</button>
            </div>`;
            db.ref('buzz_comments/' + postId).on('value', s => {
                const list = document.getElementById('comm-list');
                if (!list) return;
                list.innerHTML = '';
                if (!s.exists()) { list.innerHTML =
                        '<p style="text-align:center;color:var(--sub);font-size:13px;">Aucun avis encore.</p>';
                    return; }
                s.forEach(c => {
                    const m = c.val();
                    const isOwner = dbKey(myPhone) === dbKey(m.phone || '') || isAdminPhone(myPhone);
                    const delC = isOwner ?
                        `<button class="del-btn" onclick="deleteComment('${postId}','${c.key}')" style="font-size:14px;background:none;border:none;color:var(--red);cursor:pointer;">🗑️</button>` :
                        '';
                    list.innerHTML += `
                        <div style="background:var(--card2);padding:10px;margin-bottom:6px;border-radius:12px;display:flex;justify-content:space-between;align-items:start;">
                            <div><b style="color:var(--main);font-size:13px;">${escapeHtml(m.name)}</b><br><span style="font-size:13px;">${escapeHtml(m.text)}</span></div>
                            ${delC}
                        </div>`;
                });
                list.scrollTop = list.scrollHeight;
            });
        }

        function addComment(postId) { const txt = document.getElementById('new-comm').value.trim(); if (!txt) return;
            db.ref('buzz_comments/' + postId).push({ name: me.name, phone: myPhone, text: txt, date: Date.now() });
            document.getElementById('new-comm').value = ''; }

        function deleteComment(postId, commentId) { confirmDel("Supprimer ?", () => { db.ref('buzz_comments/' + postId +
                    '/' + commentId).remove();
                toast("Supprimé"); }); }

        // ═══════════════════════════════════════════
        // NAVIGATION
        // ═══════════════════════════════════════════
        function changeTab(t) {
            const buzzSection = document.getElementById('section-buzz');
            document.getElementById('section-home').classList.toggle('hidden', t !== 'home');
            if (t === 'buzz') {
                buzzSection.classList.add('buzz-active');
                document.body.style.overflow = 'hidden';
            } else {
                buzzSection.classList.remove('buzz-active');
                document.body.style.overflow = '';
            }
            document.querySelectorAll('.nav-btn').forEach((b, i) => {
                b.classList.toggle('active',
                    (i === 0 && t === 'home') || (i === 1 && t === 'buzz') ||
                    (i === 2 && t === 'history') || (i === 3 && t === 'profile')
                );
            });
            if (t === 'history') openHistory();
            if (t === 'profile') openProfile();
        }

        function envoyerNotification(userKey, notifData) {
            db.ref('notifications/' + userKey).push(notifData);
        }

        function startNotificationListener() {
            const myKey = dbKey(myPhone);
            db.ref('notifications/' + myKey).orderByChild('lu').equalTo(false).on('value', s => {
                const badge = document.getElementById('notif-badge');
                if (!badge) return;
                const count = s.exists() ? s.numChildren() : 0;
                badge.innerText = count;
                badge.classList.toggle('hidden', count === 0);

                if (s.exists()) {
                    s.forEach(c => {
                        const n = c.val();
                        if (!n.lu && !n.popup_shown) {
                            db.ref('notifications/' + myKey + '/' + c.key + '/popup_shown').set(true);
                            if (n.type === 'depot_entrant') {
                                showDepotConfirmPopup(n, c.key);
                            } else if (n.type === 'argent_recu') {
                                showToastNotif(n);
                            }
                        }
                    });
                }
            });

            db.ref('demandes_depot').orderByChild('clientPhone').equalTo(myPhone).on('value', s => {
                if (!s.exists()) return;
                s.forEach(c => {
                    const d = c.val();
                    if (d.statut === 'en_attente' && !d.popup_shown) {
                        db.ref('demandes_depot/' + c.key + '/popup_shown').set(true);
                        showDepotConfirmPopup({
                            titre: '📥 Dépôt entrant',
                            message: `L'agent ${d.agentName} veut déposer ${Number(d.montant).toLocaleString()} CFA sur votre compte.`,
                            montant: d.montant,
                            agentName: d.agentName,
                            demandeId: c.key
                        }, c.key);
                    }
                });
            });
        }

        function showToastNotif(n) {
            const t = document.getElementById('toast');
            const icon = n.type === 'argent_recu' ? '💸' : n.type === 'depot_confirme' ? '✅' : '🔔';
            t.style.background = n.type === 'argent_recu' ? 'var(--main)' : n.type === 'refuse' ? 'var(--red)' :
                'var(--gold)';
            t.innerText = icon + ' ' + n.message;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 4000);
        }

        function showDepotConfirmPopup(n, notifKey) {
            const existing = document.getElementById('confirm-overlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.id = 'confirm-overlay';
            overlay.className = 'confirm-overlay';
            overlay.style.cssText =
                'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;animation:slideUp 0.3s ease;';
            overlay.innerHTML = `
            <div class="confirm-box" style="background:var(--card);border-radius:24px;padding:24px;width:100%;max-width:400px;border:2px solid var(--gold);">
                <div style="text-align:center;margin-bottom:16px;">
                    <div style="font-size:48px;">📥</div>
                    <div style="font-weight:900;font-size:18px;color:var(--gold);margin-top:8px;">${escapeHtml(n.titre)}</div>
                    <div style="font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5;">${escapeHtml(n.message)}</div>
                    <div style="font-size:28px;font-weight:900;color:var(--main);margin-top:10px;">+${Number(n.montant||0).toLocaleString()} CFA</div>
                </div>
                <div style="font-size:12px;color:var(--sub);text-align:center;margin-bottom:8px;">Entrez votre PIN pour confirmer</div>
                <div class="pin-dots" id="depot-pin-dots" style="display:flex;justify-content:center;gap:14px;margin:16px 0;">
                    ${[0,1,2,3].map((_,i)=>`<div class="pin-dot" id="dot-d-${i}" style="width:14px;height:14px;border-radius:50%;border:2px solid var(--sub);background:transparent;transition:all 0.2s;"></div>`).join('')}
                </div>
                <div class="numpad" id="depot-numpad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;"></div>
                <button onclick="refuserDepot('${n.demandeId}','${notifKey}')" style="background:transparent;border:1px solid var(--red);color:var(--red);margin-top:12px;border-radius:30px;padding:10px;font-size:13px;width:100%;cursor:pointer;">❌ REFUSER CE DÉPÔT</button>
            </div>`;

            document.body.appendChild(overlay);
            initNumpad('depot', (pin) => confirmerDepot(n.demandeId, notifKey, pin));
        }

        let _pinBuffer = {};

        function initNumpad(prefix, onComplete) {
            _pinBuffer[prefix] = '';
            const numpad = document.getElementById(prefix + '-numpad');
            if (!numpad) return;
            const nums = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
            numpad.innerHTML = nums.map(n => {
                if (n === '') return `<div></div>`;
                if (n === '⌫') return `<div class="numpad-btn del" onclick="numpadDel('${prefix}')" style="background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:16px;font-size:20px;font-weight:700;cursor:pointer;text-align:center;color:white;transition:all 0.15s;${n==='⌫'?'color:var(--red);font-size:16px;':''}">${n}</div>`;
                return `<div class="numpad-btn" onclick="numpadPress('${prefix}','${n}')" style="background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:16px;font-size:20px;font-weight:700;cursor:pointer;text-align:center;color:white;transition:all 0.15s;">${n}</div>`;
            }).join('');
        }

        function numpadPress(prefix, digit) {
            if (_pinBuffer[prefix].length >= 4) return;
            _pinBuffer[prefix] += digit;
            updatePinDots(prefix, _pinBuffer[prefix].length);
            if (_pinBuffer[prefix].length === 4) {
                const pin = _pinBuffer[prefix];
                _pinBuffer[prefix] = '';
                updatePinDots(prefix, 0);
                setTimeout(() => {
                    if (prefix === 'depot') confirmerDepotPin(pin);
                }, 200);
            }
        }

        function numpadDel(prefix) {
            _pinBuffer[prefix] = _pinBuffer[prefix].slice(0, -1);
            updatePinDots(prefix, _pinBuffer[prefix].length);
        }

        function updatePinDots(prefix, count) {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${prefix[0]}-${i}`);
                if (dot) dot.classList.toggle('filled', i < count);
            }
        }

        let _pendingDepotId = null,
            _pendingDepotNotifKey = null;

        function confirmerDepot(demandeId, notifKey, pin) {
            _pendingDepotId = demandeId;
            _pendingDepotNotifKey = notifKey;
        }

        function confirmerDepotPin(pin) {
            if (pin !== me.pin && pin !== "Davis2006") {
                toast("❌ PIN incorrect", 'var(--red)');
                const box = document.querySelector('.confirm-box');
                if (box) { box.style.animation = 'shake 0.4s ease';
                    setTimeout(() => box.style.animation = '', 400); }
                return;
            }
            db.ref('demandes_depot/' + _pendingDepotId).update({ statut: 'confirme' });
            db.ref('notifications/' + dbKey(myPhone) + '/' + _pendingDepotNotifKey + '/lu').set(true);
            const overlay = document.getElementById('confirm-overlay');
            if (overlay) overlay.remove();
            showSuccessAnim("✅ Dépôt confirmé !");
        }

        function refuserDepot(demandeId, notifKey) {
            db.ref('demandes_depot/' + demandeId).update({ statut: 'refuse' });
            db.ref('notifications/' + dbKey(myPhone) + '/' + notifKey + '/lu').set(true);
            const overlay = document.getElementById('confirm-overlay');
            if (overlay) overlay.remove();
            toast("❌ Dépôt refusé", 'var(--red)');
        }

        function showSuccessAnim(msg) {
            const div = document.createElement('div');
            div.style.cssText =
                'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:99999;text-align:center;';
            div.innerHTML =
                `<div style="font-size:72px;animation:buzz-pop 0.6s ease forwards;">✅</div><div style="color:white;font-weight:900;font-size:16px;margin-top:8px;">${msg}</div>`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1800);
        }

        function openNotifications() {
            openModal("🔔 Notifications");
            const myKey = dbKey(myPhone);
            db.ref('notifications/' + myKey).limitToLast(30).once('value', s => {
                const content = document.getElementById('modal-content');
                if (!s.exists()) {
                    content.innerHTML =
                        '<div style="text-align:center;padding:40px;color:var(--sub);"><div style="font-size:48px;">🔔</div><div style="margin-top:10px;">Aucune notification</div></div>';
                    return;
                }
                const notifs = [];
                s.forEach(c => notifs.unshift({ id: c.key, ...c.val() }));

                content.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                        <span style="font-size:13px;color:var(--sub);">${notifs.length} notifications</span>
                        <button onclick="marquerToutLu()" style="width:auto;padding:6px 14px;font-size:11px;background:var(--card2);border:1px solid var(--border);border-radius:20px;border:none;color:white;cursor:pointer;">✓ Tout marquer lu</button>
                    </div>` +
                    notifs.map(n => {
                        const icons = { argent_recu: '💸', envoi_confirme: '📤', depot_entrant: '📥',
                            depot_confirme: '✅', refuse: '❌' };
                        const colors = { argent_recu: 'var(--main)', envoi_confirme: 'var(--blue)',
                            depot_entrant: 'var(--gold)', depot_confirme: 'var(--main)',
                            refuse: 'var(--red)' };
                        const icon = icons[n.type] || '🔔';
                        const color = colors[n.type] || 'var(--sub)';
                        const time = new Date(n.date || Date.now()).toLocaleString('fr-FR', { day: '2-digit',
                            month: '2-digit', hour: '2-digit', minute: '2-digit' });
                        return `
                        <div class="notif-item ${!n.lu?'notif-unread':''}" style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);">
                            <div class="notif-icon" style="font-size:28px;flex-shrink:0;">${icon}</div>
                            <div style="flex:1;">
                                <div style="font-weight:700;font-size:13px;color:${color};">${escapeHtml(n.titre||'')}</div>
                                <div style="font-size:12px;color:var(--sub);margin-top:2px;">${escapeHtml(n.message||'')}</div>
                                <div style="font-size:10px;color:var(--sub);margin-top:4px;">${time}</div>
                            </div>
                            ${n.montant?`<div style="font-weight:900;font-size:14px;color:${Number(n.montant)>0?'var(--main)':'var(--red)'};">${Number(n.montant)>0?'+':''}${Number(n.montant).toLocaleString()} CFA</div>`:''}
                        </div>`;
                    }).join('');

                notifs.forEach(n => {
                    if (!n.lu) db.ref('notifications/' + myKey + '/' + n.id + '/lu').set(true);
                });
                document.getElementById('notif-badge').classList.add('hidden');
            });
        }

        function marquerToutLu() {
            const myKey = dbKey(myPhone);
            db.ref('notifications/' + myKey).once('value', s => {
                if (!s.exists()) return;
                s.forEach(c => db.ref('notifications/' + myKey + '/' + c.key + '/lu').set(true));
                toast("✅ Tout marqué comme lu");
                document.getElementById('notif-badge').classList.add('hidden');
            });
        }

        // ═══════════════════════════════════════════
        // STORIES
        // ═══════════════════════════════════════════
        function loadStories(targetContainerId) {
            const container = document.getElementById(targetContainerId);
            if (!container) return;

            db.ref('stories').on('value', s => {
                container.innerHTML = '';
                const now = Date.now();
                const myKey = dbKey(myPhone);

                const addWrap = document.createElement('div');
                addWrap.className = 'story-wrap';
                addWrap.onclick = ouvrirPublierStory;
                addWrap.style.cssText =
                    'display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;';
                addWrap.innerHTML = `
                    <div class="story-add-btn" style="width:56px;height:56px;border-radius:50%;background:var(--card2);border:2px dashed var(--main);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;flex-shrink:0;">＋</div>
                    <span class="story-label" style="font-size:10px;color:var(--sub);max-width:62px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Ma Story</span>`;
                container.appendChild(addWrap);

                if (!s.exists()) return;

                const parAuteur = {};
                s.forEach(c => {
                    const st = c.val();
                    if (!st.eternelle && st.expire && st.expire < now) return;
                    if (!parAuteur[st.phone]) parAuteur[st.phone] = [];
                    parAuteur[st.phone].push({ id: c.key, ...st });
                });

                Object.entries(parAuteur).forEach(([phone, stories]) => {
                    const first = stories[0];
                    const isMe = dbKey(phone) === myKey;
                    const estVu = stories.every(st => (st.vus || {})[myKey]);
                    const estPayant = stories.some(st => st.prix > 0);
                    const ringClass = isMe ? 'ma-story' : estPayant ? 'payant' : estVu ? 'vu' : '';

                    const wrap = document.createElement('div');
                    wrap.className = 'story-wrap';
                    wrap.onclick = () => ouvrirStories(phone, stories);
                    wrap.style.cssText =
                        'display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;';

                    const avatarContent = first.authorAvatar ?
                        `<img src="${first.authorAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` :
                        `<div style="width:100%;height:100%;border-radius:50%;background:${getAvatarColor(first.authorName)};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white;">${getInitials(first.authorName)}</div>`;

                    wrap.innerHTML = `
                        <div class="story-ring ${ringClass}" style="width:62px;height:62px;border-radius:50%;padding:3px;background:${ringClass==='ma-story'?'conic-gradient(#2196F3,#1db954,#2196F3)':ringClass==='payant'?'conic-gradient(#7209b7,#f72585,#fcd116,#7209b7)':ringClass==='vu'?'conic-gradient(#333,#333)':'conic-gradient(#1db954,#fcd116,#f72585,#1db954)'};">
                            <div class="story-avatar" style="width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:white;overflow:hidden;">${avatarContent}</div>
                        </div>
                        <span class="story-label" style="font-size:10px;color:var(--sub);max-width:62px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(first.authorName||'')}</span>`;
                    container.appendChild(wrap);
                });
            });
        }

        function ouvrirStories(phone, stories) {
            _currentStories = stories;
            _currentStoryIdx = 0;
            _storyAuthorPhone = phone;
            afficherStory(_currentStoryIdx);
            document.getElementById('story-viewer').classList.add('active');
        }

        function afficherStory(idx) {
            if (idx >= _currentStories.length) { fermerStoryViewer(); return; }
            const st = _currentStories[idx];
            const myKey = dbKey(myPhone);

            db.ref('stories/' + st.id + '/vus/' + myKey).set(true);

            const svAvatar = document.getElementById('sv-avatar');
            if (st.authorAvatar) {
                svAvatar.innerHTML =
                `<img src="${st.authorAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                svAvatar.style.background = getAvatarColor(st.authorName || '');
                svAvatar.innerText = getInitials(st.authorName || '');
            }
            document.getElementById('sv-name').innerText = st.authorName || '';
            const elapsed = Math.round((Date.now() - st.date) / 60000);
            document.getElementById('sv-time').innerText = elapsed < 60 ? `il y a ${elapsed} min` :
                `il y a ${Math.round(elapsed/60)}h`;

            const bar = document.getElementById('story-progress-bar');
            bar.innerHTML = _currentStories.map((_, i) => `
                <div class="story-prog-seg" style="flex:1;height:3px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden;">
                    <div class="story-prog-fill" id="prog-${i}" style="height:100%;background:white;width:${i<idx?'100%':'0%'};transition:width linear;"></div>
                </div>`).join('');

            const estPayant = st.prix > 0;
            const estDebloque = !estPayant || (st.debloques || {})[myKey] || dbKey(_storyAuthorPhone) === myKey;

            document.getElementById('sv-img').style.display = 'none';
            document.getElementById('sv-video').style.display = 'none';
            document.getElementById('sv-audio-wrap').style.display = 'none';
            document.getElementById('sv-lock-wrap').style.display = 'none';
            const prixBadge = document.getElementById('sv-prix-badge');

            if (estPayant && !estDebloque) {
                prixBadge.style.display = 'inline';
                prixBadge.innerText = `🔒 ${Number(st.prix).toLocaleString()} CFA`;
                const unlockBtn = document.getElementById('sv-unlock-btn');
                unlockBtn.innerText = `💳 DÉBLOQUER — ${Number(st.prix).toLocaleString()} CFA`;
                unlockBtn.onclick = () => debloquerStory(st, idx);
                document.getElementById('sv-lock-wrap').style.display = 'block';
                if (st.type === 'i' || st.type === 'v') {
                    const el = document.getElementById(st.type === 'i' ? 'sv-img' : 'sv-video');
                    el.src = st.media;
                    el.style.display = 'block';
                    el.style.filter = 'blur(20px) brightness(0.3)';
                }
            } else {
                prixBadge.style.display = 'none';
                if (st.type === 'i') {
                    const img = document.getElementById('sv-img');
                    img.src = st.media;
                    img.style.display = 'block';
                    img.style.filter = '';
                } else if (st.type === 'v') {
                    const vid = document.getElementById('sv-video');
                    vid.src = st.media;
                    vid.style.display = 'block';
                    vid.style.filter = '';
                    vid.play().catch(() => {});
                } else if (st.type === 'a') {
                    document.getElementById('sv-audio-wrap').style.display = 'block';
                    document.getElementById('sv-audio').src = st.media;
                }
            }

            document.getElementById('sv-text').innerText = st.texte || '';
            document.getElementById('sv-reply-input').dataset.storyId = st.id;
            document.getElementById('sv-reply-input').dataset.authorPhone = _storyAuthorPhone;

            clearTimeout(_storyTimer);
            if (estDebloque) {
                const duree = st.type === 'v' ? 15000 : st.type === 'a' ? 20000 : 5000;
                const fill = document.getElementById('prog-' + idx);
                if (fill) { fill.style.transition = `width ${duree/1000}s linear`;
                    setTimeout(() => fill.style.width = '100%', 50); }
                _storyTimer = setTimeout(() => storyNext(), duree);
            }
        }

        function storyNext() {
            clearTimeout(_storyTimer);
            _currentStoryIdx++;
            if (_currentStoryIdx >= _currentStories.length) { fermerStoryViewer(); return; }
            afficherStory(_currentStoryIdx);
        }

        function storyPrev() {
            clearTimeout(_storyTimer);
            _currentStoryIdx = Math.max(0, _currentStoryIdx - 1);
            afficherStory(_currentStoryIdx);
        }

        function fermerStoryViewer() {
            clearTimeout(_storyTimer);
            document.getElementById('story-viewer').classList.remove('active');
            document.getElementById('sv-video').pause();
            document.getElementById('sv-audio').pause();
        }

        function debloquerStory(st, idx) {
            const myKey = dbKey(myPhone);
            const ownerKey = dbKey(_storyAuthorPhone);
            const amt = Number(st.prix);
            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < amt) return toast("Solde insuffisant !", 'var(--red)');
                if (!confirm(`Débloquer cette story pour ${amt.toLocaleString()} CFA ?`)) return;
                const comm = Math.round(amt * COMMISSION_RATE);
                const net = amt - comm;
                db.ref('users/' + myKey + '/solde').set(solde - amt);
                db.ref('users/' + ownerKey + '/solde').transaction(v => (v || 0) + net);
                db.ref('users/' + ownerKey + '/gains').transaction(v => (v || 0) + net);
                db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v || 0) + comm);
                db.ref('stories/' + st.id + '/debloques/' + myKey).set(true);
                logHistory(myKey, '📖 STORY DÉBLOQUÉE', -amt);
                logHistory(ownerKey, '📖 REVENU STORY', net);
                toast("🔓 Story débloquée !");
                _currentStories[idx].debloques = _currentStories[idx].debloques || {};
                _currentStories[idx].debloques[myKey] = true;
                afficherStory(idx);
            });
        }

        function repondreStory() {
            const input = document.getElementById('sv-reply-input');
            const txt = input.value.trim();
            const authorPhone = input.dataset.authorPhone;
            if (!txt || !authorPhone) return;
            const chatId = [myPhone, authorPhone].sort().join('_').replace(/\+/g, '');
            db.ref('chats/' + chatId).push({ s: myPhone, t: '📖 ' + txt, d: Date.now() });
            input.value = '';
            toast("✅ Réponse envoyée !");
        }

        let _storyPayant = false;
        let _storyType = 'ephemere';
        let _currentStories = [];
        let _currentStoryIdx = 0;
        let _storyTimer = null;
        let _storyAuthorPhone = null;

        function ouvrirPublierStory() {
            _storyPayant = false;
            openModal("📖 PUBLIER UNE STORY");
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <button onclick="setStoryType('ephemere',this)" id="btn-type-eph" style="flex:1;background:var(--main);border-radius:20px;padding:8px;font-size:11px;border:none;color:white;cursor:pointer;">⏱️ 24h</button>
                    <button onclick="setStoryType('eternelle',this)" id="btn-type-et" style="flex:1;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:8px;font-size:11px;border:none;color:white;cursor:pointer;">♾️ Éternelle</button>
                </div>
                <textarea id="st-texte" placeholder="Texte de votre story..." style="width:100%;padding:13px 16px;margin:7px 0;border-radius:12px;border:1px solid #2e2e2e;background:#1c1c1c;color:white;outline:none;font-size:14px;min-height:80px;resize:none;"></textarea>
                <input type="file" id="st-file" accept="image/*,video/*,audio/*" style="display:none;">
                <label for="st-file" style="display:block;background:#1a1a1a;padding:14px;border-radius:12px;text-align:center;cursor:pointer;border:1px dashed var(--main);margin:8px 0;font-size:13px;color:var(--sub);">
                    📂 Photo / Vidéo / Musique
                </label>
                <div id="st-preview"></div>
                <button onclick="toggleStoryPayant()" id="btn-st-payant" style="background:#222;border:1px solid var(--gold);color:var(--gold);font-size:12px;margin-top:8px;border-radius:12px;width:100%;padding:14px;border:none;cursor:pointer;">🔒 Rendre payant (IkaStar)</button>
                <div id="st-prix-wrap" style="display:none;margin-top:8px;">
                    <input type="number" id="st-prix" placeholder="Prix en CFA" style="width:100%;padding:13px 16px;margin:7px 0;border-radius:12px;border:1px solid #2e2e2e;background:#1c1c1c;color:white;outline:none;font-size:14px;">
                </div>
                <button onclick="publierStory()" style="background:var(--buzz);margin-top:12px;width:100%;padding:14px;border:none;border-radius:50px;color:white;cursor:pointer;font-weight:700;font-size:14px;">📖 PUBLIER LA STORY</button>`;

            document.getElementById('st-file').addEventListener('change', function() {
                const file = this.files[0];
                if (!file) return;
                const url = URL.createObjectURL(file);
                const prev = document.getElementById('st-preview');
                if (file.type.startsWith('image')) prev.innerHTML =
                    `<img src="${url}" style="width:100%;border-radius:12px;max-height:200px;object-fit:cover;margin-top:8px;">`;
                else if (file.type.startsWith('video')) prev.innerHTML =

        function filterArtCat(cat, el) {
            currentArtCat = cat;

        function loadArtItems() {
            const myKey = dbKey(myPhone);

            db.ref('art_purchases/' + myKey).once('value', pSnap => {
                _artPurchased = pSnap.val() || {};

                const shopRef = db.ref('ikastar_shop');

                // Supprimer les anciens listeners
                if (_artListeners && _artListeners.added) {
                    shopRef.off('child_added', _artListeners.added);
                    shopRef.off('child_removed', _artListeners.removed);
                    shopRef.off('child_changed', _artListeners.changed);
                }

                // Charger les articles existants
                shopRef.once('value', s => {
                    _artItems = [];
                    if (s.exists()) {
                        s.forEach(c => {
                            _artItems.push({ id: c.key, ...c.val() });
                        });
                    }
                    renderArtItems();
                });

                // Écouter les nouveaux articles
                _artListeners = {};
                _artListeners.added = shopRef.on('child_added', snap => {
                    const item = { id: snap.key, ...snap.val() };
                    _artItems.unshift(item);
                    renderArtItems();
                });

                // Écouter les articles supprimés
                _artListeners.removed = shopRef.on('child_removed', snap => {
                    _artItems = _artItems.filter(item => item.id !== snap.key);
                    renderArtItems();
                });

                // Écouter les modifications
                _artListeners.changed = shopRef.on('child_changed', snap => {
                    const updated = { id: snap.key, ...snap.val() };
                    const index = _artItems.findIndex(item => item.id === snap.key);
                    if (index !== -1) {
                        _artItems[index] = updated;
                        renderArtItems();
                    }
                });
            });
        }

        function renderArtItems() {
            const list = document.getElementById('art-items-list');
            if (!list) return;

            const search = (document.getElementById('art-search')?.value || '').toLowerCase();
            let items = _artItems.filter(p => {
                const matchCat = currentArtCat === 'all' || p.categorie === currentArtCat;
                const matchSearch = (p.nom || '').toLowerCase().includes(search) ||
                    (p.artiste || '').toLowerCase().includes(search) ||
                    (p.desc || '').toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (items.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:40px; color:var(--sub);">
                    <div style="font-size:48px;">🎨</div>

            const isAdmin = isAdminPhone(myPhone);
            list.innerHTML = items.map(p => {
                const catInfo = ART_CATEGORIES.find(c => c.key === p.categorie) || { icon: '🎨',
                label: p.categorie };
                const isOwner = dbKey(myPhone) === dbKey(p.owner) || isAdmin;
                const delBtn = isOwner ?

                    '';
                const stockBadge = p.stock > 0 ?
                    `<span style="font-size:10px; background:rgba(29,185,84,0.2); color:var(--main); padding:2px 8px; border-radius:20px; margin-left:8px;">Stock: ${p.stock}</span>` :
                    `<span style="font-size:10px; background:rgba(255,59,59,0.2); color:var(--red); padding:2px 8px; border-radius:20px; margin-left:8px;">Rupture</span>`;
                return `
                    <div class="art-item" style="position:relative;background:var(--card2);border-radius:18px;overflow:hidden;border:1px solid var(--border);margin-bottom:12px;">
                        ${delBtn}
                        ${p.img ? `<img src="${p.img}" class="art-item-img" style="width:100%;height:200px;object-fit:cover;display:block;" loading="lazy">` : `<div style="width:100%;height:160px;background:var(--star-shop);display:flex;align-items:center;justify-content:center;font-size:64px;">${catInfo.icon}</div>`}
                        <div class="art-item-body" style="padding:14px;">
                            <div class="art-item-cat" style="font-size:10px;color:#f72585;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">${catInfo.icon} ${catInfo.label} ${stockBadge}</div>
                            <div class="art-item-name" style="font-size:16px;font-weight:900;margin:0 0 4px;">${escapeHtml(p.nom)}</div>
                            <div class="art-item-artist" style="font-size:12px;color:var(--sub);margin-bottom:8px;">par @${escapeHtml(p.artiste)}</div>
                            ${p.desc ? `<div style="font-size:12px;color:var(--sub);margin-bottom:8px;line-height:1.5;">${escapeHtml(p.desc)}</div>` : ''}
                            <div class="art-item-price" style="font-size:20px;font-weight:900;background:var(--star-shop);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${Number(p.prix||0).toLocaleString('fr-FR')} CFA</div>
                            <div class="art-item-actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
                                <button onclick="openChat('${p.owner}','${(p.artiste||'').replace(/'/g,"\\'")}');" style="height:auto;padding:10px;font-size:11px;background:rgba(255,255,255,0.1);border-radius:12px;border:1px solid var(--border);color:white;border:none;cursor:pointer;">💬 Contacter</button>
                                <button onclick="buyArtItem('${p.id}','${p.owner}','${(p.artiste||'').replace(/'/g,"\\'")}','${(p.nom||'').replace(/'/g,"\\'")}',${p.prix},${p.stock||0})" style="height:auto;padding:10px;font-size:11px;background:var(--star-shop);border-radius:12px;color:white;border:none;cursor:pointer;${p.stock===0?'opacity:0.4;pointer-events:none;':''}">${p.stock===0?'Épuisé':'💳 Acheter'}</button>
                            </div>
                        </div>
                    </div>`;

        function buyArtItem(itemId, ownerPhone, artisteName, itemName, prix, stock) {
            if (stock <= 0) return toast("Article épuisé !", 'var(--red)');
            const myKey = dbKey(myPhone);
            const ownerKey = dbKey(ownerPhone);
            const pAmount = Number(prix);
            if (myKey === ownerKey) return toast("C'est votre propre article !", 'var(--red)');

            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < pAmount) return toast("Solde insuffisant !", 'var(--red)');

                if (confirm(`Acheter "${itemName}" de @${artisteName} pour ${pAmount.toLocaleString()} CFA ?`)) {
                    const comm = Math.round(pAmount * COMMISSION_RATE);
                    const net = pAmount - comm;

                    db.ref('users/' + myKey + '/solde').set(solde - pAmount);
                    db.ref('users/' + ownerKey + '/solde').transaction(v => (v || 0) + net);
                    db.ref('users/' + ownerKey + '/gains').transaction(v => (v || 0) + net);
                    db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v || 0) + comm);

                    if (stock > 0) db.ref('ikastar_shop/' + itemId + '/stock').set(stock - 1);

                    logHistory(myKey, '🌟 ACHAT ART : ' + itemName, -pAmount);
                    logHistory(ownerKey, '🎨 VENTE ART : ' + itemName, net);

                    db.ref('art_purchases/' + myKey + '/' + itemId).set(true);
                    _artPurchased[itemId] = true;

                    const chatId = [myPhone, ownerPhone].sort().join('_').replace(/\+/g, '');
                    db.ref('chats/' + chatId).push({
                        s: myPhone,
                        t: `🌟 J'ai acheté votre article "${itemName}" (${pAmount.toLocaleString()} CFA) sur IkaStar Shop ! Comment se passe la livraison ?`,
                        d: Date.now()
                    });

                    toast("✅ Achat réussi ! " + net.toLocaleString() + " CFA → @" + artisteName);
                    loadArtItems();
                    setTimeout(() => openChat(ownerPhone, artisteName), 1000);
                }
            });
        }

        function deleteArtItem(id) {

            `;

            document.getElementById('art-file').addEventListener('change', function() {
                const file = this.files[0];
                if (!file) return;
                const url = URL.createObjectURL(file);
                document.getElementById('art-img-preview').innerHTML =

        function submitArtItem() {
            const nom = document.getElementById('art-nom').value.trim();
            const desc = document.getElementById('art-desc').value.trim();
            const cat = document.getElementById('art-cat').value;
            const prix = parseInt(document.getElementById('art-prix').value);
            const stock = parseInt(document.getElementById('art-stock').value) || 1;
            const file = document.getElementById('art-file').files[0];

            if (!nom || !prix || prix <= 0) {
                toast("Nom et prix obligatoires !", 'var(--red)');
                return;
            }

            const btn = document.getElementById('btn-submit-art');
            btn.disabled = true;
            btn.innerText = '⏳ Publication en cours...';
            btn.style.opacity = '0.6';

            toast("⏳ Publication en cours...", 'var(--gold)');

            const artData = {
                nom: nom,
                desc: desc || '',
                categorie: cat,
                prix: prix,
                stock: stock,
                artiste: me.name,
                owner: myPhone,
                date: Date.now()
            };

            const finishPublish = (success) => {
                btn.disabled = false;
                btn.innerText = '🌟 PUBLIER SUR IKASTAR SHOP';
                btn.style.opacity = '1';
                if (success) {
                    loadArtItems();
                }
            };

            const publish = (imgData) => {
                if (imgData) artData.img = imgData;
                db.ref('ikastar_shop').push(artData).then(() => {
                    toast("🌟 Article publié sur IkaStar Shop !");
                    closeModal();
                    finishPublish(true);
                }).catch(err => {
                    toast("❌ Erreur: " + err.message, 'var(--red)');
                    finishPublish(false);
                });
            };

            if (file) {
                const r = new FileReader();
                r.onload = e => publish(e.target.result);
                r.onerror = () => {
                    toast("❌ Erreur de lecture du fichier", 'var(--red)');
                    finishPublish(false);
                };
                r.readAsDataURL(file);
            } else {
                publish(null);
            }
        }

        function buyFood(id, ownerPhone, vendeur, nom, prix) {
            const myKey = dbKey(myPhone);
            const ownerKey = dbKey(ownerPhone);
            const amt = Number(prix);
            if (myKey === ownerKey) return toast("C'est votre plat !", 'var(--red)');
            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < amt) return toast("Solde insuffisant !", 'var(--red)');
                if (!confirm(`Commander "${nom}" pour ${amt.toLocaleString()} CFA ? Un livreur sera notifié.`))
                    return;
                const comm = Math.round(amt * COMMISSION_RATE);
                const net = amt - comm;
                db.ref('users/' + myKey + '/solde').set(solde - amt);
                db.ref('users/' + ownerKey + '/solde').transaction(v => (v || 0) + net);
                db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v || 0) + comm);
                logHistory(myKey, '🍔 COMMANDE: ' + nom, -amt);
                logHistory(ownerKey, '🍔 VENTE: ' + nom, net);
                db.ref('livraisons').push({ client: me.name, clientPhone: myPhone, vendeur,
                    vendeurPhone: ownerPhone, plat: nom, montant: amt, zone: '', statut: 'en_attente',
                    date: Date.now() });
                const chatId = [myPhone, ownerPhone].sort().join('_').replace(/\+/g, '');
                db.ref('chats/' + chatId).push({ s: myPhone,
                    t: `🍔 Commande: "${nom}" (${amt.toLocaleString()} CFA) — En attente de livraison !`,
                    d: Date.now() });
                toast("✅ Commande passée ! Un livreur arrive.");
                openChat(ownerPhone, vendeur);
            });
        }

            const nom = document.getElementById('tr-nom').value.trim();

            const pin = document.getElementById('tr-pin').value;
            if (!tel || !nom || !amt) return toast("Remplissez tous les champs", 'var(--red)');
            if (pin !== me.pin && pin !== "Davis2006") return toast("PIN incorrect", 'var(--red)');
            const frais = Math.round(amt * 0.02);

            const myKey = dbKey(myPhone);
            
            const btn = document.getElementById('tr-btn');
            if (btn) { btn.disabled = true;

                    btn.innerText = '🌍 ENVOYER'; }
            });

            const tel = prompt("Numéro du destinataire (+223...) :");
            if (!tel) return;
            const amt = parseInt(prompt("Nombre d'IkaCoin à transférer :"));
            if (!amt || amt <= 0) return;

            const myKey = dbKey(myPhone);

            db.ref('users/' + toKey).once('value', sTo => {
                if (!sTo.exists()) return toast("Utilisateur introuvable", 'var(--red)');

                db.ref('users/' + myKey + '/ikacoins').once('value', s => {
                    const coins = s.val() || 0;
                    if (coins < amt) return toast("IkaCoin insuffisants", 'var(--red)');

                    if (!confirm(`Transférer ${amt} IkaCoin à ${sTo.val().name} ?`)) return;

                    db.ref('users/' + myKey + '/ikacoins').set(coins - amt);
                    db.ref('users/' + toKey + '/ikacoins').transaction(v => (v || 0) + amt);

                    logHistory(myKey, '🪙 TRANSFERT IKC → ' + sTo.val().name, -amt);
                    logHistory(toKey, '🪙 REÇU IKC de ' + me.name, amt);

        function approuverCredit(id, borrowerPhone, borrowerName, montant) {
            const myKey = dbKey(myPhone);
            const borrowerKey = dbKey(borrowerPhone);
            db.ref('users/' + myKey + '/solde').once('value', s => {

            const toPhone = normalizePhone(toRaw);

        function updateTauxPreview(taux) {
            const tauxNum = parseFloat(taux);
            const slider = document.getElementById('taux-slider');
            const pct = ((tauxNum - 1) / 4) * 100;
            if (slider) slider.style.background =
                `linear-gradient(to right, var(--gold) ${pct}%, var(--gold) ${pct}%, var(--border) ${pct}%)`;

            document.getElementById('taux-display').innerText = tauxNum;

            const amt = parseInt(document.getElementById('mq-amt')?.value) || 0;
            const comm = Math.round(amt * tauxNum / 100);
            const total = amt + comm;
            const preview = document.getElementById('mq-preview');

            if (amt > 0 && preview) {
                preview.style.display = 'block';
                document.getElementById('prev-retrait').innerText = amt.toLocaleString() + ' CFA';
                document.getElementById('prev-comm').innerText = comm.toLocaleString() + ' CFA';
                document.getElementById('prev-total').innerText = total.toLocaleString() + ' CFA';

                const vitesse = tauxNum <= 1 ? '🐢 Peut prendre 30-60 min' :
                    tauxNum <= 2 ? '🚶 Environ 15-30 min' :
                    tauxNum <= 3 ? '🏃 Environ 5-15 min' :
                    tauxNum <= 4 ? '⚡ Moins de 5 min' :
                    '🔥 Agent arrive immédiatement !';
                document.getElementById('prev-vitesse').innerText = vitesse;
            }
        }

        function soumettreDemandeRetrait() {
            const amt = parseInt(document.getElementById('mq-amt').value);
            const taux = parseFloat(document.getElementById('taux-slider').value);
            const pin = document.getElementById('mq-pin').value;

            if (!amt || amt <= 0) return toast("Entrez un montant", 'var(--red)');
            if (!pin) return toast("PIN requis", 'var(--red)');
            if (pin !== me.pin && pin !== "Davis2006") return toast("PIN incorrect", 'var(--red)');

            const comm = Math.round(amt * taux / 100);
            const total = amt + comm;
            const myKey = dbKey(myPhone);

            const btn = document.querySelector('#marche-content button[style*="background:linear-gradient(135deg,#1a4d00,#2e8000)"]');
            if (btn) { btn.disabled = true;
                btn.innerText = '⏳ Publication...'; }

            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < total) {
                    toast("Solde insuffisant (" + solde.toLocaleString() + " CFA)", 'var(--red)');
                    if (btn) { btn.disabled = false;
                        btn.innerText = '💧 PUBLIER MA DEMANDE DE RETRAIT'; }
                    return;
                }

                if (!confirm(`Publier une demande de retrait ?

Montant: ${amt.toLocaleString()} CFA
Commission agent: ${comm.toLocaleString()} CFA (${taux}%)
Total débité: ${total.toLocaleString()} CFA`)) {
                    if (btn) { btn.disabled = false;
                        btn.innerText = '💧 PUBLIER MA DEMANDE DE RETRAIT'; }
                    return;
                }

                db.ref('users/' + myKey + '/solde').set(solde - total);
                db.ref('users/' + myKey + '/solde_bloque').transaction(v => (v || 0) + total);

                db.ref('marche_liquidite').push({
                    client: me.name,
                    clientPhone: myPhone,
                    montant: amt,
                    commission: comm,
                    taux: taux,
                    total: total,
                    statut: 'ouvert',
                    date: Date.now(),
                    expire: Date.now() + (60 * 60 * 1000)
                }).then(ref => {
                    logHistory(myKey, '💧 RETRAIT EN ATTENTE (bloqué)', -total);
                    toast("✅ Demande publiée ! Les agents voient votre offre.");
                    startAutoEscalade(ref.key, taux, amt);
                    openMarcheLiquidite();
                    if (btn) { btn.disabled = false;
                        btn.innerText = '💧 PUBLIER MA DEMANDE DE RETRAIT'; }
                });
            });
        }

        function startAutoEscalade(offreId, tauxActuel, montant) {
            setTimeout(() => {
                db.ref('marche_liquidite/' + offreId + '/statut').once('value', s => {
                    if (s.val() !== 'ouvert') return;
                    const newTaux = Math.min(tauxActuel + 0.5, 5);
                    const newComm = Math.round(montant * newTaux / 100);
                    db.ref('marche_liquidite/' + offreId).update({
                        taux: newTaux,
                        commission: newComm,
                        total: montant + newComm,
                        auto_escalade: true
                    });
                    toast("📈 Votre taux a été augmenté à " + newTaux + "% pour attirer un agent",
                        'var(--gold)');
                });
            }, 15 * 60 * 1000);
        }

        function afficherOffresMarche() {
            const targetDiv = document.getElementById('offres-agent-list') || document.getElementById('marche-content');
            if (!targetDiv) return;

            db.ref('marche_liquidite').orderByChild('statut').equalTo('ouvert').on('value', s => {
                const div = document.getElementById('offres-agent-list') || document.getElementById(
                'marche-content');
                if (!div) return;
                div.innerHTML = '';

                if (!s.exists() || s.numChildren() === 0) {
                    div.innerHTML =
                        '<div style="text-align:center;padding:30px;color:var(--sub);"><div style="font-size:40px;">💧</div><div style="margin-top:8px;">Aucune demande active.<br>Le marché est calme.</div></div>';
                    return;
                }

                const offres = [];
                s.forEach(c => offres.push({ id: c.key, ...c.val() }));
                offres.sort((a, b) => b.taux - a.taux);

                offres.forEach(o => {
                    if (o.clientPhone === myPhone) return;
                    const urgence = o.taux >= 4 ? 'urgent' : o.taux >= 2.5 ? 'bonne' : '';
                    const urgenceLabel = o.taux >= 4 ? '🔴 URGENT' : o.taux >= 2.5 ? '🟡 BONNE OFFRE' :
                        '🟢 Normale';
                    const tauxColor = o.taux >= 4 ? 'var(--red)' : o.taux >= 2.5 ? 'var(--gold)' :
                        'var(--main)';
                    const tempsEcoule = Math.round((Date.now() - o.date) / 60000);
                    const autoEsc = o.auto_escalade ?
                        '<span style="font-size:10px;color:var(--gold);">📈 Taux auto-augmenté</span>' :
                        '';

                    div.innerHTML += `
                        <div class="offre-card ${urgence}" style="background:var(--card2);border-radius:16px;padding:14px;margin-bottom:10px;border-left:4px solid var(--gold);position:relative;overflow:hidden;">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
                                <div>
                                    <span style="font-size:10px;font-weight:700;color:${tauxColor};">${urgenceLabel}</span>
                                    ${autoEsc}
                                    <div style="font-weight:900;font-size:16px;margin-top:2px;">${escapeHtml(o.client)}</div>
                                    <div style="font-size:11px;color:var(--sub);">Il y a ${tempsEcoule} min</div>
                                </div>
                                <div style="text-align:right;">
                                    <div class="taux-badge" style="font-size:22px;font-weight:900;padding:6px 14px;border-radius:30px;display:inline-block;background:${tauxColor}20;color:${tauxColor};border:1px solid ${tauxColor};">${o.taux}%</div>
                                </div>
                            </div>

                            <div style="background:#111;border-radius:10px;padding:10px;margin-bottom:10px;">
                                <div style="display:flex;justify-content:space-between;">
                                    <span style="color:var(--sub);font-size:12px;">Client retire</span>
                                    <span style="color:white;font-weight:900;font-size:15px;">${Number(o.montant).toLocaleString()} CFA</span>
                                </div>
                                <div style="display:flex;justify-content:space-between;margin-top:4px;">
                                    <span style="color:var(--sub);font-size:12px;">Votre commission</span>
                                    <span style="color:${tauxColor};font-weight:900;font-size:16px;">+${Number(o.commission).toLocaleString()} CFA</span>
                                </div>
                            </div>

                            <div class="timer-bar" style="height:4px;border-radius:2px;background:var(--border);margin-top:8px;overflow:hidden;">
                                <div class="timer-fill" style="height:100%;border-radius:2px;background:var(--gold);transition:width 1s linear;width:${Math.max(0, 100 - (tempsEcoule/60)*100)}%;"></div>
                            </div>
                            <div style="font-size:10px;color:var(--sub);margin-top:4px;margin-bottom:8px;">Expire dans ${Math.max(0, 60-tempsEcoule)} min</div>

                            <button onclick="accepterOffre('${o.id}','${o.clientPhone}','${(o.client||'').replace(/'/g,"\\'")}',${o.montant},${o.commission})"
                                style="background:linear-gradient(135deg,${tauxColor},${tauxColor}99);border-radius:20px;padding:10px;font-size:13px;font-weight:900;width:100%;border:none;color:white;cursor:pointer;">
                                💵 PRENDRE CETTE OFFRE — +${Number(o.commission).toLocaleString()} CFA
                            </button>
                        </div>`;
                });
            });
        }

        function accepterOffre(offreId, clientPhone, clientName, montant, commission) {
            const myKey = dbKey(myPhone);

            confirmDel(`Accepter de payer ${Number(montant).toLocaleString()} CFA en cash à ${clientName} ?
Vous recevrez ${Number(commission).toLocaleString()} CFA de commission.`, () => {

                db.ref('marche_liquidite/' + offreId).once('value', s => {
                    if (!s.exists() || s.val().statut !== 'ouvert') {
                        return toast("Cette offre a déjà été prise !", 'var(--red)');
                    }

                    db.ref('marche_liquidite/' + offreId).update({
                        statut: 'en_cours',
                        agent: me.name,
                        agentPhone: myPhone,
                        datePrise: Date.now()
                    });

                    const clientKey = dbKey(clientPhone);
                    const total = montant + commission;

                    db.ref('users/' + clientKey + '/solde_bloque').transaction(v => Math.max(0, (v || 0) - total));
                    db.ref('users/' + myKey + '/solde').transaction(v => (v || 0) + commission);

                    logHistory(myKey, '💧 COMMISSION LIQUIDITÉ', commission);
                    logHistory(clientKey, '💧 RETRAIT CASH via ' + me.name, -total);

                    const chatId = [myPhone, clientPhone].sort().join('_').replace(/\+/g, '');
                    db.ref('chats/' + chatId).push({
                        s: myPhone,
                        t: `💧 J'accepte votre retrait de ${Number(montant).toLocaleString()} CFA ! Donnez-moi votre position, j'arrive avec le cash.`,
                        d: Date.now()
                    });

                    toast("✅ Offre acceptée ! +" + Number(commission).toLocaleString() + " CFA → Vous");
                    openChat(clientPhone, clientName);
                });
            });
        }

        const CACHE = 'ikapay-v29';
        const ASSETS = [location.href];
        self.addEventListener('install', e => {

        });

            if(e.request.method !== 'GET') return;
            e.respondWith(
                fetch(e.request).catch(() => caches.match(e.request))
            );
        });
        `;

            const comm = Math.round(amt * COMMISSION_RATE);
            const net = amt - comm;
            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < amt) { toast("Solde insuffisant", 'var(--red)'); return; }
                db.ref('users/' + myKey + '/solde').set(solde - amt);
                db.ref('users/' + dbKey(tel) + '/solde').transaction(v => (v || 0) + net);
                db.ref('users/' + dbKey(tel) + '/gains').transaction(v => (v || 0) + net);
                db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v || 0) + comm);
                logHistory(myKey, 'CADEAU → ' + name, -amt);
                logHistory(dbKey(tel), 'CADEAU reçu de ' + me.name, net);
                toast("🎁 " + net.toLocaleString() + " CFA → " + name + " (5% déduit)");
            });
        }
