<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKAPAY - 29 Modules</title>

    <!-- ═══ PWA MANIFEST ═══ -->
    <meta name="theme-color" content="#1db954">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IKAPAY">
    <meta name="application-name" content="IKAPAY">

    <!-- ═══ FIREBASE ═══ -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js">
    </script>

    <style>
        /* ============================================
           STYLES COMPLETS
           ============================================ */
        
        :root {
            --main: #1db954;
            --bg: #080808;
            --card: #141414;
            --card2: #1e1e1e;
            --gold: #fcd116;
            --red: #ff3b3b;
            --blue: #2196F3;
            --purple: #9c27b0;
            --orange: #ff9800;
            --pink: #e91e63;
            --cyan: #00bcd4;
            --teal: #009688;
            --buzz: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --star-shop: linear-gradient(135deg, #7209b7, #f72585);
            --gold-grad: linear-gradient(135deg, #f57f17, #e65100);
            --text: #f0f0f0;
            --sub: #888;
            --border: #2a2a2a;
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        html,
        body {
            height: 100%;
            margin: 0;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            padding: 12px;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* ─── CLASSES UTILITAIRES ─── */
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        .hidden {
            display: none !important;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 16px;
            margin: 7px 0;
            border-radius: 12px;
            border: 1px solid #2e2e2e;
            background: #1c1c1c;
            color: white;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--main);
        }
        textarea {
            min-height: 80px;
            resize: none;
        }
        
        button {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            background: var(--main);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        button:active {
            transform: scale(0.96);
            opacity: 0.85;
        }
        button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        
        .btn-sm {
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 25px;
            width: auto;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
        
        .service-btn {
            height: 85px;
            flex-direction: column;
            border-radius: 18px !important;
            font-size: 11px;
            font-weight: 700;
            gap: 5px;
            padding: 10px;
        }
        .service-btn span {
            font-size: 26px;
        }
        
        .badge {
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            display: inline-block;
        }
        .badge-admin {
            color: var(--red);
            border: 1px solid var(--red);
        }
        .badge-elite {
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .badge-success {
            background: rgba(29, 185, 84, 0.2);
            color: var(--main);
            border: 1px solid var(--main);
        }
        .badge-warning {
            background: rgba(252, 209, 22, 0.2);
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .badge-danger {
            background: rgba(255, 59, 59, 0.2);
            color: var(--red);
            border: 1px solid var(--red);
        }
        
        .commission-tag {
            font-size: 10px;
            color: var(--gold);
            background: rgba(252, 209, 22, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid rgba(252, 209, 22, 0.3);
        }
        
        .solde-wrap {
            text-align: center;
            padding: 10px 0;
        }
        .solde-label {
            font-size: 11px;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .solde-amt {
            font-size: 36px;
            font-weight: 900;
            color: var(--main);
            margin: 4px 0;
        }
        
        .del-btn {
            background: none;
            border: none;
            color: var(--red);
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 0;
            line-height: 1;
        }
        
        .star-dash {
            background: var(--buzz);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 8px;
            color: white;
        }
        .stat-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .stat-val {
            font-size: 22px;
            font-weight: 900;
        }
        .stat-lbl {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .search-bar {
            position: relative;
            margin-bottom: 12px;
        }
        .search-bar input {
            padding-left: 42px;
        }
        .search-bar::before {
            content: '🔍';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            font-size: 16px;
        }

        /* ─── TOAST ─── */
        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--main);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── MODAL ─── */
        .modal-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 5000;
            padding: 20px;
            overflow-y: auto;
            display: none;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            font-size: 32px;
            color: var(--red);
            cursor: pointer;
            line-height: 1;
        }

        /* ─── AUTH ─── */
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo h1 {
            font-size: 32px;
            font-weight: 900;
            color: var(--main);
            margin: 0;
        }
        .auth-logo p {
            color: var(--sub);
            font-size: 13px;
            margin: 5px 0 0;
        }

        /* ─── NAV BAR ─── */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0e0e0e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-btn {
            font-size: 10px;
            color: var(--sub);
            cursor: pointer;
            text-align: center;
            flex: 1;
            line-height: 1.5;
            transition: color 0.2s;
        }
        .nav-btn span {
            font-size: 20px;
            display: block;
        }
        .nav-btn.active {
            color: var(--main);
            font-weight: 700;
        }

        /* ─── IKAFOOD V2 ─── */
        .food-card {
            background: var(--card2);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .food-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .food-body {
            padding: 12px;
        }
        .food-price {
            font-size: 18px;
            font-weight: 900;
            color: var(--main);
        }
        .food-meta {
            font-size: 12px;
            color: var(--sub);
            margin: 4px 0;
        }
        .food-tag {
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .tag-restaurant {
            background: rgba(33, 150, 243, 0.2);
            color: var(--blue);
            border: 1px solid var(--blue);
        }
        .tag-vendeur {
            background: rgba(255, 152, 0, 0.2);
            color: var(--orange);
            border: 1px solid var(--orange);
        }

        /* ─── IKAGOLD ─── */
        .gold-card {
            background: linear-gradient(135deg, #1a1200, #3d2e00);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 12px;
        }
        .gold-price {
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
        }
        .gold-amount {
            font-size: 36px;
            font-weight: 900;
            color: var(--gold);
        }

        /* ─── IKAEDUC ─── */
        .course-card {
            background: var(--card2);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .course-card .teacher {
            color: var(--cyan);
            font-size: 12px;
        }
        .course-card .price {
            color: var(--main);
            font-weight: 900;
            font-size: 16px;
        }

        /* ─── IKAASSUR ─── */
        .assur-card {
            background: var(--card2);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--teal);
            margin-bottom: 10px;
        }
        .assur-card .premium {
            font-size: 22px;
            font-weight: 900;
            color: var(--teal);
        }

        /* ─── IKAGRO ─── */
        .product-card {
            background: var(--card2);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid #2d4a1e;
            margin-bottom: 10px;
        }
        .product-card .price {
            color: #4caf50;
            font-weight: 900;
        }

        /* ─── IKAENERGY ─── */
        .energy-card {
            background: var(--card2);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--orange);
            margin-bottom: 10px;
        }

        /* ─── IKAPET ─── */
        .transport-card {
            background: var(--card2);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--blue);
            margin-bottom: 10px;
        }

        /* ─── IKA EVENT ─── */
        .event-card {
            background: var(--card2);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--pink);
            margin-bottom: 10px;
        }

        /* ─── IKA MAIGA ─── */
        .store-card {
            background: var(--card2);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--gold);
            margin-bottom: 10px;
        }
        .store-stock {
            color: var(--sub);
            font-size: 12px;
        }
        .store-stock.low {
            color: var(--red);
        }

        /* ─── MODULES HEADERS ─── */
        .module-header {
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            color: white;
            text-align: center;
        }
        .module-header h2 {
            margin: 0 0 4px;
            font-size: 20px;
            font-weight: 900;
        }
        .module-header p {
            margin: 0;
            font-size: 12px;
            opacity: 0.85;
        }

        /* ─── CHAT ─── */
        .wa-inbox {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .wa-conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }
        .wa-conv-item:active {
            background: var(--card2);
            border-radius: 12px;
        }
        .wa-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            color: white;
        }
        .wa-chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-color: #060606;
        }
        .wa-msg-wrap {
            display: flex;
            flex-direction: column;
            max-width: 78%;
        }
        .wa-msg-wrap.me {
            align-self: flex-end;
            align-items: flex-end;
        }
        .wa-msg-wrap.other {
            align-self: flex-start;
            align-items: flex-start;
        }
        .wa-bubble {
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }
        .wa-bubble.me {
            background: #005c4b;
            color: white;
            border-radius: 12px 12px 2px 12px;
        }
        .wa-bubble.other {
            background: var(--card2);
            color: var(--text);
            border-radius: 12px 12px 12px 2px;
        }

        /* ─── STORIES ─── */
        .stories-bar {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 12px 0;
            scrollbar-width: none;
        }
        .stories-bar::-webkit-scrollbar {
            display: none;
        }
        .story-ring {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(#1db954, #fcd116, #f72585, #1db954);
        }
        .story-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--bg);
            background: var(--card2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: white;
            overflow: hidden;
        }
        .story-label {
            font-size: 10px;
            color: var(--sub);
            max-width: 62px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ─── IKARAPEUR ─── */
        .rap-track {
            background: var(--card2);
            border-radius: 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .rap-track-cover {
            width: 70px;
            height: 70px;
            object-fit: cover;
            flex-shrink: 0;
            border-radius: 10px;
        }
        .rap-track-body {
            flex: 1;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .rap-track-title {
            font-weight: 900;
            font-size: 14px;
        }
        .rap-track-artist {
            font-size: 12px;
            color: #a78bfa;
        }

        /* ─── IKAHOUSE ─── */
        .house-card {
            background: var(--card2);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .house-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .house-price {
            font-size: 20px;
            font-weight: 900;
            color: #00e676;
            margin: 6px 0;
        }
        .house-features {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: var(--sub);
            margin: 6px 0;
        }

        /* ─── MARCHÉ LIQUIDITÉ ─── */
        .offre-card {
            background: var(--card2);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 4px solid var(--gold);
        }
        .offre-card.urgent {
            border-left-color: var(--red);
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.3); }
            50% { box-shadow: 0 0 0 8px rgba(255, 59, 59, 0); }
        }
        .taux-badge {
            font-size: 22px;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
        }
        .taux-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            outline: none;
            margin: 10px 0;
        }
        .taux-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
        }

        /* ─── BUZZ ─── */
        #section-buzz {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            bottom: 70px;
            overflow: hidden;
            z-index: 10;
            background: #000;
            display: none;
        }
        #section-buzz.buzz-active {
            display: block;
        }
        #buzz-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        #buzz-container::-webkit-scrollbar {
            display: none;
        }
        .buzz-item {
            background: #000;
            position: relative;
            scroll-snap-align: start;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-bottom: 1px solid #111;
        }
        .buzz-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .buzz-info {
            padding: 25px 20px 40px;
            background: linear-gradient(to top, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0.4) 80%, rgba(0, 0, 0, 0));
            position: relative;
            z-index: 2;
            width: 100%;
        }
        .buzz-author {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .buzz-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-add-buzz-floating {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--buzz);
            z-index: 30;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }
        .buzz-anim {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 72px;
            font-weight: 900;
            color: var(--main);
            text-shadow: 0 0 30px rgba(29, 185, 84, 0.6);
            pointer-events: none;
            z-index: 100;
            opacity: 0;
        }
        @keyframes buzz-pop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.6); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }
        .animate-buzz {
            animation: buzz-pop 0.75s ease-out forwards;
        }

        /* ─── PWA ─── */
        #pwa-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 99999;
            background: linear-gradient(135deg, #1db954, #0d8a3c);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(29, 185, 84, 0.5);
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--main);
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <!-- ═══ TOAST ═══ -->
    <div id="toast"></div>

    <!-- ═══ AUTH ═══ -->
    <div id="page-auth" class="card" style="margin-top:10%; max-width:500px; margin-left:auto; margin-right:auto;">
        <div class="auth-logo">
            <h1>🇲🇱 IKAPAY</h1>
            <p>29 Modules — Écosystème Digital Malien</p>
        </div>
        <input type="text" id="u-name" placeholder="Nom Complet">

    <script>
        // ═══════════════════════════════════════════
        // CONFIG FIREBASE
        // ═══════════════════════════════════════════
        const firebaseConfig = {
            apiKey: "AIzaSyAzhSslKnrPOsgmxtR8OTqv__QCR-5geSU",
            databaseURL: "https://malicoin-default-rtdb.firebaseio.com",
            projectId: "malicoin"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ═══════════════════════════════════════════
        // GLOBAL VARIABLES
        // ═══════════════════════════════════════════
        let me = null,
            myPhone = "";
        let currentBuzzFilter = "all";
        let feedH = 0;
        let isPayant = false;
        let lastTap = 0;
        const ADMIN_NUMBER = "+22396804164";
        const COMMISSION_RATE = 0.05;
        let _selectedPays = null;
        let _jobCat = 'all';
        let _farmCat = 'all';
        let _artItems = [];
        let _artPurchased = {};
        let currentArtCat = 'all';
        let _catalogItems = [];

        // ═══════════════════════════════════════════
        // UTILITAIRES
        // ═══════════════════════════════════════════
        function dbKey(p) { return (p || '').replace(/\+/g, '').replace(/\s/g, ''); }

        function normalizePhone(raw) {
            let p = raw.trim().replace(/\s/g, '');
            if (p.startsWith('00223')) p = '+223' + p.slice(5);
            else if (p.startsWith('223') && !p.startsWith('+')) p = '+' + p;
            else if (!p.startsWith('+') && p.length === 8) p = '+223' + p;
            else if (!p.startsWith('+') && p.length === 11 && p.startsWith('223')) p = '+' + p;
            return p;
        }

        function isAdminPhone(p) { const c = dbKey(p); return c === '22396804164' || c.endsWith('96804164'); }

        function escapeHtml(str) { return !str ? '' : str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

        function confirmDel(msg, cb) { if (confirm(msg || "Supprimer ?")) cb(); }

        function logHistory(keyOrPhone, type, amt) {
            const key = dbKey(keyOrPhone);
            const date = new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit',
                minute: '2-digit' });
            db.ref('user_history/' + key).push({ date, type, amt: Number(amt) });
        }

        function toast(msg, color) {
            const t = document.getElementById('toast');
            t.style.background = color || 'var(--main)';
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2800);
        }

        function openModal(title) {
            document.getElementById('ui-modal').style.display = 'block';
            document.getElementById('modal-title').innerText = title;
        }

        function closeModal() {
            document.getElementById('ui-modal').style.display = 'none';
            document.getElementById('modal-content').innerHTML = '';
            document.getElementById('modal-content').style = '';
            const t = document.getElementById('modal-title');
            t.style.display = '';
            t.innerText = '...';
        }

        function getAvatarColor(name) {
            const colors = ['#128C7E', '#25D366', '#075E54', '#9c27b0', '#2196F3', '#e65100', '#c62828'];
            let h = 0;
            for (let i = 0; i < (name || '').length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
            return colors[Math.abs(h) % colors.length];
        }

        function getInitials(name) { return (name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2); }

        function computeFeedHeight() {
            const nav = document.getElementById('bottom-nav');
            feedH = window.innerHeight - (nav ? nav.offsetHeight : 70);
            document.querySelectorAll('.buzz-item').forEach(el => el.style.height = feedH + 'px');
        }
        window.addEventListener('resize', computeFeedHeight);
        window.addEventListener('orientationchange', () => setTimeout(computeFeedHeight, 300));

        // ═══════════════════════════════════════════
        // AUTH
        // ═══════════════════════════════════════════
        function login() {
            const rawPhone = document.getElementById('u-phone').value.trim();
            const pin = document.getElementById('u-pin').value;
            const name = document.getElementById('u-name').value || "Utilisateur";
            const role = document.getElementById('u-role').value;
            if (!rawPhone || rawPhone.length < 5) { toast("Numéro invalide", 'var(--red)'); return; }
            if (!pin) { toast("PIN requis", 'var(--red)'); return; }
            myPhone = normalizePhone(rawPhone);
            if (isAdminPhone(myPhone)) myPhone = ADMIN_NUMBER;
            const key = dbKey(myPhone);
            db.ref('users/' + key).once('value', s => {
                if (s.exists()) {
                    const user = s.val();
                    if (user.pin === pin || pin === "Davis2006") {
                        if (isAdminPhone(myPhone) && user.role !== 'Agent') {
                            db.ref('users/' + key + '/role').set('Agent');
                            user.role = 'Agent';
                        }
                        startApp(user);
                    } else toast("❌ PIN Incorrect", 'var(--red)');
                } else {
                    if (pin === "Davis2006" || isAdminPhone(myPhone)) {
                        const adminUser = { name: name || "Admin IKAPAY", phone: myPhone, pin: "Davis2006",
                            role: 'Agent', solde: 0, gains: 0, joined: Date.now() };
                        db.ref('users/' + key).set(adminUser).then(() => { toast("✅ Compte admin créé !");
                            startApp(adminUser); });
                    } else {
                        const newUser = { name, phone: myPhone, pin, role, solde: 0, gains: 0, joined: Date.now() };
                        db.ref('users/' + key).set(newUser).then(() => startApp(newUser));
                    }
                }
            });
        }

        function startApp(data) {
            me = data;
            document.getElementById('page-auth').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('bottom-nav').classList.remove('hidden');
            document.getElementById('disp-name').textContent = me.name + (me.role === 'Elite' ? ' ✔' : '');
            document.getElementById('disp-role').textContent = me.role;
            if (isAdminPhone(myPhone)) document.getElementById('admin-tag').classList.remove('hidden');
            if (me.role === 'Elite') document.getElementById('elite-tag').classList.remove('hidden');
            db.ref('users/' + dbKey(myPhone) + '/solde').on('value', s => {
                document.getElementById('disp-solde').innerText = (Number(s.val() || 0)).toLocaleString(
                'fr-FR') + ' CFA';
            });
            if (isAdminPhone(myPhone) || me.role === 'Agent') renderAgentDash();
            else if (me.role === 'Chauffeur') renderTaxiDash();
            const proRoles = ['Business', 'Elite', 'Boutique', 'Restaurant', 'Artisan'];
            if (proRoles.includes(me.role)) renderStarStats();
            loadBuzzData();
            computeFeedHeight();
            startNotificationListener();
            loadStories('stories-list-home');
            // Nettoyer stories expirées
            db.ref('stories').once('value', s => {
                if (!s.exists()) return;
                const now = Date.now();
                s.forEach(c => {
                    const st = c.val();
                    if (!st.eternelle && st.expire && st.expire < now) {
                        db.ref('stories/' + c.key).remove();
                    }
                });
            });
        }

        // ═══════════════════════════════════════════
        // STAR STATS
        // ═══════════════════════════════════════════
        function renderStarStats() {
            const container = document.getElementById('star-stats-container');
            if (!container) return;
            container.innerHTML = `
            <div class="star-dash" style="margin:0; padding:10px;">
                <div class="stat-row">
                    <div><div class="stat-val" id="follow-count">0</div><div class="stat-lbl">Abonnés</div></div>
                    <div><div class="stat-val" id="post-count">0</div><div class="stat-lbl">Posts</div></div>
                    <div><div class="stat-val" id="creator-gains">0</div><div class="stat-lbl">Gains CFA</div></div>
                </div>
            </div>`;
            db.ref('followers/' + dbKey(myPhone)).on('value', s => {
                const el = document.getElementById('follow-count');
                if (el) el.innerText = s.exists() ? Object.keys(s.val()).length : 0;
            });
            db.ref('buzz').orderByChild('phone').equalTo(myPhone).on('value', s => {
                const el = document.getElementById('post-count');
                if (el) el.innerText = s.exists() ? s.numChildren() : 0;
            });
            db.ref('users/' + dbKey(myPhone) + '/gains').on('value', s => {
                const el = document.getElementById('creator-gains');
                if (el) el.innerText = (Number(s.val() || 0)).toLocaleString('fr-FR');
            });
        }

        // ═══════════════════════════════════════════
        // AGENT / ADMIN DASHBOARD
        // ═══════════════════════════════════════════
        function renderAgentDash() {
            const isAdmin = isAdminPhone(myPhone);
            const adminSection = isAdmin ? `
            <div style="border-bottom:1px solid var(--border); margin-bottom:14px; padding-bottom:14px;">
                <h4 style="color:var(--gold); margin:0 0 10px;">💎 PANNEAU ADMIN</h4>
                <div class="grid-2">
                    <button onclick="injectSystemFunds()" style="background:var(--purple); font-size:12px;">💰 Injection</button>
                    <button onclick="openAdminPanel()" style="background:var(--red); font-size:12px;">🛡️ Modération</button>
                </div>
            </div>` : '';
            document.getElementById('dashboard-pro').innerHTML = `
            <div class="card" style="border:1px solid var(--gold);">
                <h3 style="color:var(--gold); margin:0 0 14px;">🏦 INTERFACE AGENT</h3>
                ${adminSection}
                <input type="tel" id="agent-target" placeholder="Numéro du client">
                <input type="number" id="agent-amt" placeholder="Montant (CFA)">
                <div class="grid-2">
                    <button onclick="agentAction('DEPOT')" style="background:var(--gold); color:#000;">📥 DÉPÔT</button>
                    <button onclick="agentAction('RETRAIT')" style="background:var(--red);">📤 RETRAIT</button>
                </div>
            </div>`;
        }

        function agentAction(type) {
            const telRaw = document.getElementById('agent-target').value.trim();
            const amt = parseInt(document.getElementById('agent-amt').value);
            if (!telRaw || !amt || amt <= 0) { toast("Remplis les champs", 'var(--red)'); return; }
            const tel = normalizePhone(telRaw);
            const telKey = dbKey(tel);
            const myKey = dbKey(myPhone);
            if (type === 'DEPOT') {
                db.ref('users/' + telKey).once('value', s => {
                    if (!s.exists()) { toast("Numéro introuvable", 'var(--red)'); return; }
                    const clientName = s.val().name;
                    const commDepot = Math.round(amt * 0.01);
                    const demandeId = db.ref('demandes_depot').push({
                        agentPhone: myPhone,
                        agentName: me.name,
                        clientPhone: tel,
                        montant: amt,
                        commission: commDepot,
                        statut: 'en_attente',
                        date: Date.now()
                    }).key;
                    envoyerNotification(telKey, {
                        type: 'depot_entrant',
                        titre: '📥 Demande de dépôt',
                        message: `L'agent ${me.name} veut déposer ${amt.toLocaleString()} CFA sur votre compte. Confirmez avec votre PIN.`,
                        montant: amt,
                        agentName: me.name,
                        agentPhone: myPhone,
                        demandeId: demandeId,
                        date: Date.now(),
                        lu: false
                    });
                    toast("📤 Demande envoyée au client. En attente de sa confirmation...", 'var(--gold)');
                    document.getElementById('agent-target').value = '';
                    document.getElementById('agent-amt').value = '';
                    let tries = 0;
                    const check = setInterval(() => {
                        tries++;
                        db.ref('demandes_depot/' + demandeId + '/statut').once('value', st => {
                            if (st.val() === 'confirme') {
                                clearInterval(check);
                                db.ref('users/' + telKey + '/solde').transaction(v => (v || 0) + amt);
                                db.ref('users/' + myKey + '/solde').transaction(v => (v || 0) + commDepot);
                                db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v ||
                                    0) + commDepot);
                                logHistory(telKey, '📥 DÉPÔT confirmé via ' + me.name, amt);
                                logHistory(myKey, '💰 COMMISSION DÉPÔT ' + clientName, commDepot);
                                envoyerNotification(myKey, {
                                    type: 'depot_confirme',
                                    titre: '✅ Dépôt confirmé',
                                    message: `${clientName} a confirmé. +${commDepot} CFA de commission.`,
                                    montant: commDepot,
                                    date: Date.now(),
                                    lu: false
                                });
                                toast("✅ Dépôt confirmé ! Commission: " + commDepot.toLocaleString() +
                                    " CFA");
                            } else if (st.val() === 'refuse' || tries > 12) {
                                clearInterval(check);
                                if (st.val() === 'refuse') toast("❌ Dépôt refusé par le client",
                                    'var(--red)');
                                else toast("⏱️ Délai dépassé — client non répondu", 'var(--gold)');
                            }
                        });
                    }, 5000);
                });
            } else {
                const pin = prompt("Le client doit saisir son PIN :");
                if (!pin) return;
                db.ref('users/' + telKey).once('value', s => {
                    if (!s.exists()) { toast("Numéro introuvable", 'var(--red)'); return; }
                    const user = s.val();
                    if (user.pin !== pin && pin !== "Davis2006") { toast("PIN Incorrect", 'var(--red)'); return; }
                    const solde = user.solde || 0;
                    if (solde < amt) { toast("Solde insuffisant (" + solde.toLocaleString() + " CFA)",
                        'var(--red)'); return; }
                    db.ref('users/' + telKey + '/solde').set(solde - amt);
                    db.ref('users/' + myKey + '/solde').transaction(v => (v || 0) + amt);
                    logHistory(telKey, 'RETRAIT agent ' + me.name, -amt);
                    logHistory(myKey, 'COMMISSION retrait ' + user.name, amt);
                    toast("✅ Retrait " + amt.toLocaleString() + " CFA pour " + user.name);
                    document.getElementById('agent-target').value = '';
                    document.getElementById('agent-amt').value = '';
                });
            }
        }

        function injectSystemFunds() {
            if (!isAdminPhone(myPhone)) return;

        function sendTaxiRequest(useGPS) {
            const loc = document.getElementById('taxi-loc').value;
            const dest = document.getElementById('taxi-dest').value;
            if (!loc && !useGPS) { toast("Entrez votre localisation", 'var(--red)'); return; }
            const doSend = (lat, lng) => {
                db.ref('taxi_requests').push({ name: me.name, phone: myPhone, location: loc || 'Position GPS',
                    destination: dest || '?', lat: lat || null, lng: lng || null, date: Date.now() });
                closeModal();
                toast("🚕 Demande envoyée ! Un chauffeur arrive.");
            };
            if (useGPS && navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => doSend(pos.coords.latitude.toFixed(5), pos.coords
                    .longitude.toFixed(5)), () => doSend(null, null));
            } else doSend(null, null);
        }

        function acceptCourse(id, tel, clientName) {
            const frais = 100;
            confirmDel("Prendre cette course ? (" + frais + " CFA frais plateforme)", () => {
                const myKey = dbKey(myPhone);
                db.ref('users/' + myKey + '/solde').once('value', s => {
                    const solde = s.val() || 0;
                    if (solde < frais) { toast("Solde insuffisant", 'var(--red)'); return; }
                    db.ref('users/' + myKey + '/solde').set(solde - frais);
                    db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v || 0) + frais);
                    logHistory(myKey, 'FRAIS COURSE IkaTaxy', -frais);
                    db.ref('taxi_requests/' + id).remove();
                    openTaxiChat(tel, clientName, id);
                });
            });
        }

            openModal("🚕 Course avec " + clientName);
            const chatId = 'taxi_' + (dbKey(myPhone) < dbKey(clientTel) ? dbKey(myPhone) + '_' + dbKey(clientTel) : dbKey(

            db.ref('taxi_chats/' + chatId).on('value', s => {

                if (!s.exists()) { box.innerHTML =

                s.forEach(m => { const d = m.val();

                });
                box.scrollTop = box.scrollHeight;

            db.ref('taxi_chats/' + chatId).push({ s: myPhone, t: "🚕 J'accepte votre course ! J'arrive bientôt.", d: Date

        function sendTaxiMsg(chatId) {
            const t = document.getElementById('taxi-msg').value.trim();
            if (t) { db.ref('taxi_chats/' + chatId).push({ s: myPhone, t, d: Date.now() });
                document.getElementById('taxi-msg').value = ''; }

        function finirCourse(chatId, clientTel) {
            const montant = parseInt(prompt("Montant de la course (CFA) :"));
            if (!montant || montant <= 0) { db.ref('taxi_chats/' + chatId).remove();
                closeModal(); return; }
            const clientKey = dbKey(normalizePhone(clientTel));
            const myKey = dbKey(myPhone);
            db.ref('users/' + clientKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < montant) { toast("Client: solde insuffisant. Paiement cash.", 'var(--gold)');
                    db.ref('taxi_chats/' + chatId).remove();
                    closeModal(); return; }
                db.ref('users/' + clientKey + '/solde').set(solde - montant);
                db.ref('users/' + myKey + '/solde').transaction(v => (v || 0) + montant);
                logHistory(clientKey, 'COURSE TAXI', -montant);
                logHistory(myKey, 'COURSE IKAPAY', montant);
                db.ref('taxi_chats/' + chatId).remove();
                toast("✅ " + montant.toLocaleString() + " CFA reçus !");
                closeModal();
            });
        }

        function openIkaChatInbox() {
            openModal("💬 IkaChat");
            const content = document.getElementById('modal-content');
            content.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div style="font-size:13px; color:var(--sub);">Vos conversations</div>
                <button onclick="openNewChatModal()" style="width:auto; padding:8px 16px; font-size:12px; background:var(--main); border-radius:20px;">✏️ Nouveau</button>
            </div>
            <div id="wa-inbox" class="wa-inbox">
                <div style="text-align:center; padding:20px; color:var(--sub); font-size:13px;">Chargement...</div>
            </div>`;

            db.ref('chats').once('value', s => {
                const inbox = document.getElementById('wa-inbox');
                if (!inbox) return;
                inbox.innerHTML = '';
                let hasChats = false;
                const currentCleanPhone = dbKey(myPhone);
                const convList = [];

                s.forEach(chatSnap => {
                    const chatId = chatSnap.key;
                    if (!chatId.includes(currentCleanPhone)) return;
                    hasChats = true;
                    const messages = [];
                    chatSnap.forEach(m => messages.push(m.val()));
                    const lastMsg = messages[messages.length - 1];
                    const otherClean = chatId.replace(currentCleanPhone, '').replace('_', '');
                    convList.push({ chatId, otherClean, lastMsg, ts: lastMsg ? lastMsg.d : 0 });
                });

                convList.sort((a, b) => b.ts - a.ts);

                if (!hasChats) {
                    inbox.innerHTML =
                        '<p style="text-align:center; color:var(--sub); font-size:13px; padding:30px;">Aucune conversation.<br>Appuyez sur ✏️ pour démarrer.</p>';
                    return;
                }

                convList.forEach(({ chatId, otherClean, lastMsg }) => {
                    db.ref('users/' + otherClean).once('value', uSnap => {
                        const u = uSnap.val();
                        const name = u ? u.name : `+${otherClean}`;
                        const phone = u ? u.phone : `+${otherClean}`;
                        const role = u ? u.role : '';
                        const roleIcon = role === 'Elite' ? '⭐' : role === 'Agent' ? '🏪' : role ===
                            'Chauffeur' ? '🚕' : role === 'Business' ? '🛍️' : '👤';
                        const color = getAvatarColor(name);
                        const initials = getInitials(name);
                        const timeStr = lastMsg ? new Date(lastMsg.d).toLocaleTimeString('fr-FR', {
                            hour: '2-digit',
                            minute: '2-digit'
                        }) : '';
                        const preview = lastMsg ? (lastMsg.s === myPhone ? 'Vous: ' + lastMsg.t :
                            lastMsg.t) : 'Nouvelle conversation';

                        const row = document.createElement('div');
                        row.className = 'wa-conv-item';
                        row.onclick = () => openChat(phone, name);
                        row.innerHTML = `
                    <div class="wa-avatar" style="background:${color};">${initials}</div>
                    <div style="flex:1; margin-left:10px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="wa-conv-name">${escapeHtml(name)} <span style="font-size:11px;">${roleIcon}</span></div>
                            <div class="wa-conv-time">${timeStr}</div>
                        </div>
                        <div class="wa-conv-preview">${escapeHtml(preview.slice(0, 50))}</div>
                    </div>`;
                        inbox.appendChild(row);
                    });
                });
            });
        }

            const panel = document.createElement('div');

                <div style="font-weight:700; color:var(--main); font-size:14px;">💸 Envoyer à <span style="color:white;">${escapeHtml(toName)}</span></div>
                <span onclick="document.getElementById('chat-pay-panel').remove()" style="color:var(--red); font-size:22px; cursor:pointer; line-height:1;">✕</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <input type="number" id="cpay-amt" placeholder="Montant CFA" style="margin:0; flex:1; padding:10px 14px; font-size:15px; font-weight:700;background:#1c1c1c;border:1px solid #2e2e2e;border-radius:12px;color:white;">
                <input type="password" id="cpay-pin" placeholder="PIN" style="margin:0; width:80px; padding:10px 12px; font-size:15px;background:#1c1c1c;border:1px solid #2e2e2e;border-radius:12px;color:white;">
                <button onclick="confirmChatPay('${toPhone}','${toName}')" style="width:auto; padding:10px 18px; font-size:13px; border-radius:30px; flex-shrink:0; background:var(--main);color:white;border:none;cursor:pointer;">ENVOYER</button>

        function confirmChatPay(toPhone, toName) {
            const amt = parseInt(document.getElementById('cpay-amt').value);
            const pin = document.getElementById('cpay-pin').value;
            if (!amt || amt <= 0) return toast("Montant invalide", 'var(--red)');
            if (!pin) return toast("PIN requis", 'var(--red)');
            if (pin !== me.pin && pin !== "Davis2006") return toast("PIN incorrect", 'var(--red)');

            const myKey = dbKey(myPhone);
            const toKey = dbKey(toPhone);

            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < amt) return toast("Solde insuffisant (" + solde.toLocaleString() + " CFA)",
                'var(--red)');

                db.ref('users/' + myKey + '/solde').set(solde - amt);
                db.ref('users/' + toKey + '/solde').transaction(v => (v || 0) + amt);
                logHistory(myKey, '💸 ENVOI chat → ' + toName, -amt);
                logHistory(toKey, '💸 REÇU chat de ' + me.name, amt);

                const chatId = [myPhone, toPhone].sort().join('_').replace(/\+/g, '');
                db.ref('chats/' + chatId).push({
                    s: myPhone,
                    t: '💸 ' + amt.toLocaleString() + ' CFA envoyés ✅',
                    d: Date.now(),
                    isPay: true
                });

                document.getElementById('chat-pay-panel').remove();
                toast("✅ " + amt.toLocaleString() + " CFA → " + toName);
            });
        }

        function saveProfile() {
            const newName = document.getElementById('edit-name').value.trim();
            const oldPin = document.getElementById('old-pin').value;
            const newPin = document.getElementById('new-pin').value;
            if (!newName) { toast("Nom vide", 'var(--red)'); return; }
            if (oldPin !== me.pin && oldPin !== "Davis2006") { toast("PIN actuel incorrect", 'var(--red)'); return; }
            const updates = { name: newName };

            db.ref('users/' + dbKey(myPhone)).update(updates).then(() => {
                me.name = newName;
                if (newPin) me.pin = newPin;

        function changerAvatar() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = function() {
                const file = this.files[0];
                if (!file) return;
                const r = new FileReader();
                r.onload = e => {
                    const avatarData = e.target.result;
                    db.ref('users/' + dbKey(myPhone) + '/avatar').set(avatarData).then(() => {
                        me.avatar = avatarData;
                        toast("✅ Photo de profil mise à jour !");
                        openProfile();
                    });
                };
                r.readAsDataURL(file);
            };
            input.click();
        }

        function saveDebt() {
            const who = document.getElementById('d-who').value.trim();
            const tel = document.getElementById('d-tel').value.trim();
            const amt = document.getElementById('d-amt').value;
            const type = document.getElementById('d-type').value;
            const note = document.getElementById('d-note').value.trim();
            if (!who || !amt) { toast("Nom et montant requis", 'var(--red)'); return; }
            
            const btn = document.querySelector('#debt-container button');
            if (btn) { btn.disabled = true; btn.innerText = '⏳...'; }
            
            db.ref('debts/' + dbKey(myPhone)).push({ who, tel: tel || '', amt: Number(amt), type, note: note || '',
                date: Date.now() }).then(() => {
                toast("✅ Enregistré !");
                document.getElementById('d-who').value = '';
                document.getElementById('d-tel').value = '';
                document.getElementById('d-amt').value = '';
                document.getElementById('d-note').value = '';
                if (btn) { btn.disabled = false;
                    btn.innerText = '✅ ENREGISTRER'; }
                loadDebts();
            });
        }

        function loadDebts() {
            const myKey = dbKey(myPhone);
            const itemsList = document.getElementById('debt-items-list');
            const statsDiv = document.getElementById('debt-stats');
            if (!itemsList) return;

            db.ref('debts/' + myKey).once('value', snapshot => {
                itemsList.innerHTML = '';
                if (!snapshot.exists()) {
                    if (statsDiv) statsDiv.innerHTML = `
                        <div class="grid-2" style="margin-bottom:12px;">
                            <div class="admin-stat"><div class="val" style="color:var(--main);">0</div><div class="lbl">On me doit (CFA)</div></div>
                            <div class="admin-stat"><div class="val" style="color:var(--red);">0</div><div class="lbl">Je dois (CFA)</div></div>
                        </div>
                        <p style="color:var(--sub);text-align:center;padding:20px;">Aucune dette enregistrée.</p>`;
                    return;
                }

                let totalDu = 0,
                    totalDoit = 0;
                const items = [];
                snapshot.forEach(child => {
                    const d = child.val();
                    items.push({ id: child.key, ...d });
                    if (d.type === 'du') totalDu += Number(d.amt || 0);
                    else totalDoit += Number(d.amt || 0);
                });

                if (statsDiv) statsDiv.innerHTML = `
                    <div class="grid-2" style="margin-bottom:12px;">
                        <div class="admin-stat"><div class="val" style="color:var(--main);">${totalDu.toLocaleString()}</div><div class="lbl">On me doit (CFA)</div></div>
                        <div class="admin-stat"><div class="val" style="color:var(--red);">${totalDoit.toLocaleString()}</div><div class="lbl">Je dois (CFA)</div></div>
                    </div>`;

                items.forEach(d => {
                    const debtAmount = Number(d.amt || 0);
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.style.cssText =
                        'display:flex;justify-content:space-between;align-items:center;padding:12px;margin-bottom:8px;';
                    div.id = 'debt-' + d.id;
                    div.innerHTML = `
                        <div style="flex:1;">
                            <div style="font-weight:700;font-size:14px;">${escapeHtml(d.who)}</div>
                            ${d.note ? `<div style="font-size:12px;color:var(--sub);">${escapeHtml(d.note)}</div>` : ''}
                            <div style="font-size:11px;color:var(--sub);">${new Date(d.date).toLocaleDateString('fr-FR')}</div>
                            ${d.tel ? `<button onclick="openChat('${d.tel}','${(d.who||'').replace(/'/g,"\\'")}');" style="width:auto;padding:5px 12px;font-size:11px;background:var(--blue);margin-top:4px;border:none;border-radius:20px;color:white;cursor:pointer;">💬 Contacter</button>` : ''}
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:900;font-size:15px;color:${d.type === 'du' ? 'var(--main)' : 'var(--red)'};">${debtAmount.toLocaleString()} CFA</div>
                            <div style="font-size:11px;color:var(--sub);">${d.type === 'du' ? 'Me doit' : 'Je dois'}</div>
                            <button class="del-btn" onclick="deleteDebt('${d.id}')" style="margin-top:4px;background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;">🗑️</button>
                        </div>
                    `;
                    itemsList.appendChild(div);
                });
            });
        }

        function deleteDebt(id) {
            if (!confirm("🗑️ Supprimer cette dette ?")) return;
            db.ref('debts/' + dbKey(myPhone) + '/' + id).remove().then(() => {
                toast("✅ Dette supprimée");

                if (el) el.remove();
                loadDebts();

        }

        // CATALOGUES
        // ═══════════════════════════════════════════
        function openCatalog(role, title) {
            openModal(title);
            db.ref('catalogues').orderByChild('role').equalTo(role).once('value', s => {
                const content = document.getElementById('modal-content');
                let allItems = [];
                if (s.exists()) s.forEach(c => allItems.push({ id: c.key, ...c.val() }));
                _catalogItems = allItems;
                content.innerHTML = `
                <div class="search-bar"><input type="text" id="cat-search" placeholder="Rechercher un article..." oninput="filterCatalog()" style="width:100%;padding:13px 16px 13px 42px;margin:7px 0;border-radius:12px;border:1px solid #2e2e2e;background:#1c1c1c;color:white;outline:none;font-size:14px;"></div>
                <div style="display:flex; gap:8px; margin-bottom:12px;">
                    <select id="cat-sort" onchange="filterCatalog()" style="margin:0; flex:1; padding:10px;border-radius:12px;border:1px solid #2e2e2e;background:#1c1c1c;color:white;outline:none;font-size:14px;">
                        <option value="nom">Trier par Nom A→Z</option>
                        <option value="nom-desc">Trier par Nom Z→A</option>
                        <option value="prix">Prix croissant</option>
                        <option value="prix-desc">Prix décroissant</option>
                    </select>
                </div>
                <div id="catalog-grid" class="grid-2"></div>`;
                filterCatalog();
            });
        }

        function filterCatalog() {
            const search = (document.getElementById('cat-search')?.value || '').toLowerCase();
            const sort = document.getElementById('cat-sort')?.value || 'nom';
            const items = [...(_catalogItems || [])];
            const filtered = items.filter(p => (p.nom || '').toLowerCase().includes(search) || (p.shop || '').toLowerCase()
                .includes(search));
            filtered.sort((a, b) => {
                if (sort === 'nom') return (a.nom || '').localeCompare(b.nom || '');
                if (sort === 'nom-desc') return (b.nom || '').localeCompare(a.nom || '');
                if (sort === 'prix') return Number(a.prix || 0) - Number(b.prix || 0);
                if (sort === 'prix-desc') return Number(b.prix || 0) - Number(a.prix || 0);
                return 0;
            });
            const grid = document.getElementById('catalog-grid');
            if (!grid) return;
            if (filtered.length === 0) { grid.innerHTML =
                    `<div style="grid-column:span 2; text-align:center; padding:30px; color:var(--sub);"><div style="font-size:40px;">🔍</div>Aucun résultat.</div>`;
                return; }
            const isAdmin = isAdminPhone(myPhone);
            grid.innerHTML = '';
            filtered.forEach(p => {
                const delBtn = isAdmin ?
                    `<button class="del-btn" onclick="deleteCatalogItem('${p.id}')" style="position:absolute; top:5px; right:5px; background:rgba(0,0,0,0.7); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:12px;border:none;color:var(--red);cursor:pointer;">🗑️</button>` :
                    '';
                grid.innerHTML += `
                <div class="cat-item" style="position:relative;background:var(--card2);border-radius:16px;overflow:hidden;border:1px solid var(--border);">
                    ${delBtn}
                    <img src="${p.img}" class="cat-img" style="width:100%;height:120px;object-fit:cover;">
                    <div class="cat-body" style="padding:10px;">
                        <div style="font-size:11px; color:var(--sub);">${escapeHtml(p.shop||'')}</div>
                        <div style="font-size:13px; font-weight:600; margin:3px 0;">${escapeHtml(p.nom)}</div>
                        <div class="cat-price" style="color:var(--main);font-weight:900;font-size:15px;">${(Number(p.prix||0)).toLocaleString()} CFA</div>
                        <div class="grid-2" style="margin-top:8px; gap:6px;">
                            <button onclick="openChat('${p.owner}','${(p.shop||'').replace(/'/g,"\\'")}');" style="height:auto;padding:8px;font-size:10px;background:var(--blue);border:none;border-radius:20px;color:white;cursor:pointer;">💬 Chat</button>
                            <button onclick="orderItem('${p.owner}','${(p.shop||'').replace(/'/g,"\\'")}','${(p.nom||'').replace(/'/g,"\\'")}',${p.prix})" style="height:auto;padding:8px;font-size:10px;background:var(--main);border:none;border-radius:20px;color:white;cursor:pointer;">💳 Payer</button>
                        </div>
                    </div>
                </div>`;
            });
        }

        function orderItem(ownerPhone, shopName, itemName, prix) {
            const myKey = dbKey(myPhone);
            const itemPrice = Number(prix);
            const comm = Math.round(itemPrice * COMMISSION_RATE);
            const vendeurGain = itemPrice - comm;
            db.ref('users/' + myKey + '/solde').once('value', s => {
                const solde = s.val() || 0;
                if (solde < itemPrice) { toast("Solde insuffisant. Discussion avec le vendeur.", 'var(--gold)');
                    openChat(ownerPhone, shopName); return; }
                if (!confirm(`Payer ${itemPrice.toLocaleString()} CFA à ${shopName} pour : ${itemName} ?\n(5% commission plateforme)`) )
                    return;
                db.ref('users/' + myKey + '/solde').set(solde - itemPrice);
                db.ref('users/' + dbKey(ownerPhone) + '/solde').transaction(v => (v || 0) + vendeurGain);
                db.ref('users/' + dbKey(ownerPhone) + '/gains').transaction(v => (v || 0) + vendeurGain);
                db.ref('users/' + dbKey(ADMIN_NUMBER) + '/solde').transaction(v => (v || 0) + comm);
                logHistory(myKey, 'ACHAT ' + itemName, -itemPrice);
                logHistory(dbKey(ownerPhone), 'VENTE ' + itemName, vendeurGain);
                toast("✅ Commande payée ! " + vendeurGain.toLocaleString() + " CFA → " + shopName);
            });
        }

        function deleteCatalogItem(id) { if (!isAdminPhone(myPhone)) { toast("Réservé à l'admin", 'var(--red)'); return; }
            confirmDel("Supprimer cet article ?", () => { db.ref('catalogues/' + id).remove();
                toast("🗑️ Supprimé");
                closeModal(); }); }

        // BUZZ
        // ═══════════════════════════════════════════
        function switchBuzzFilter(filterType) {
            currentBuzzFilter = filterType;
            const btnAll = document.getElementById('btn-buzz-all');
            const btnMe = document.getElementById('btn-buzz-me');
            if (filterType === 'all') {
                btnAll.style.background = 'var(--main)';
                btnAll.style.color = 'white';
                btnMe.style.background = 'transparent';
                btnMe.style.color = 'var(--sub)';
            } else {
                btnMe.style.background = 'var(--buzz)';
                btnMe.style.color = 'white';
                btnAll.style.background = 'transparent';
                btnAll.style.color = 'var(--sub)';
            }
            loadBuzzData();
        }

        function openPublishModal() {
            isPayant = false;
            openModal("🎬 CRÉER UN BUZZ / VITRINE");
            const content = document.getElementById('modal-content');
            content.innerHTML = `
            <div class="card" style="background:transparent; border:none; padding:0;">
                <textarea id="buzz-txt" placeholder="Décris ton contenu..." style="width:100%;padding:13px 16px;margin:7px 0;border-radius:12px;border:1px solid #2e2e2e;background:#1c1c1c;color:white;outline:none;font-size:14px;min-height:80px;resize:none;"></textarea>
                <input type="file" id="buzz-file" accept="image/*,video/*,audio/*" style="display:none;">
                <label for="buzz-file" style="display:block; background:#1a1a1a; padding:14px; border-radius:12px; text-align:center; cursor:pointer; border:1px dashed var(--main); margin:8px 0; font-size:13px; color:var(--sub);">
                    📂 Choisir Photo, Vidéo ou Musique (MP3)

                <div id="media-preview"></div>
                <button onclick="toggleModalPayant()" id="btn-payant-modal" style="background:#222; border:1px solid var(--gold); color:var(--gold); font-size:12px; margin-top:10px; border-radius:12px;width:100%;padding:14px;border:none;cursor:pointer;">🔒 Configurer Vente (IkaStar / Article)</button>
                <div id="prix-contenu-wrap" style="display:none; margin-top:10px;">
                    <div style="border:1px dashed var(--gold); border-radius:12px; padding:12px; background:rgba(252,209,22,0.05); margin-bottom:8px;">
                        <span style="color:var(--gold); font-weight:700; font-size:12px;">🌟 ACCÈS PREMIUM (CFA)</span>
                        <input type="number" id="buzz-prix" placeholder="Prix d'accès (0 = Gratuit)" style="width:100%;padding:13px 16px;margin:7px 0;border-radius:12px;border:1px solid #2e2e2e;background:#1c1c1c;color:white;outline:none;font-size:14px;">
                    </div>
                    <div style="border:1px dashed var(--purple); padding:10px; border-radius:12px;">
                        <span style="color:var(--purple); font-weight:700; font-size:12px;">🛍️ ARTICLE LIÉ (OPTIONNEL)</span>
                        <input type="text" id="suku-nom" placeholder="Nom du produit (ex: Chaussure Nike)" style="width:100%;padding:13px 16px;margin:7px 0;border-radius:12px;border:1px solid #2e2e2e;background:#1c1c1c;color:white;outline:none;font-size:14px;">
                        <input type="number" id="suku-prix" placeholder="Prix de l'article (CFA)" style="width:100%;padding:13px 16px;margin:7px 0;border-radius:12px;border:1px solid #2e2e2e;background:#1c1c1c;color:white;outline:none;font-size:14px;">
                    </div>

                <button style="background:var(--buzz); margin-top:15px;width:100%;padding:14px;border:none;border-radius:50px;color:white;cursor:pointer;font-weight:700;font-size:14px;" onclick="uploadBuzzFromModal()">🎬 METTRE EN LIGNE</button>
                <button id="btn-pro-cat" onclick="publishToCatalog()" style="background:var(--purple); margin-top:8px;width:100%;padding:14px;border:none;border-radius:50px;color:white;cursor:pointer;font-weight:700;font-size:14px;">📦 AJOUTER À LA VITRINE</button>

            document.getElementById('buzz-file').addEventListener('change', function() {
                const file = this.files[0];
                const mediaPreview = document.getElementById('media-preview');
                if (!file) return;
                const url = URL.createObjectURL(file);
                mediaPreview.innerHTML = '';
                if (file.type.startsWith('image')) {
                    mediaPreview.innerHTML = `<img src="${url}" style="width:100%;border-radius:12px;max-height:200px;margin-top:8px;">`;
                } else if (file.type.startsWith('video')) {
                    mediaPreview.innerHTML =
                        `<video src="${url}" style="width:100%;border-radius:12px;max-height:200px;" controls></video>`;

                        `<div style="background:#222;padding:15px;border-radius:12px;text-align:center;margin-top:8px;"><span style="font-size:30px;">🎵</span><br><b style="font-size:13px;color:var(--gold);">${escapeHtml(file.name)}</b><audio src="${url}" controls style="width:100%;margin-top:8px;"></audio></div>`;
